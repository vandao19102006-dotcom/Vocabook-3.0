/* ================= Writing (IELTS) =================
   Chấm theo 4 tiêu chí công khai của IELTS (Task Achievement/Response, Coherence & Cohesion, Lexical Resource,
   Grammatical Range & Accuracy), sửa lỗi ngay trong bài và viết lại bản cải thiện. Bài viết không lưu trên máy chủ. */
const WR_KINDS={
  ac1:{short:'Task 1 · Academic',crit:'Task Achievement',min:150},
  gt1:{short:'Task 1 · General',crit:'Task Achievement',min:150},
  t2:{short:'Task 2',crit:'Task Response',min:250}};
const WR_TYPES={grammar:'Ngữ pháp',vocabulary:'Từ vựng',cohesion:'Liên kết',punctuation:'Dấu câu',spelling:'Chính tả',task:'Nội dung',style:'Văn phong'};
const WR_T2_END=' Give reasons for your answer and include any relevant examples from your own knowledge or experience. Write at least 250 words.';
const WR_SAMPLES={
  t2:['Some people believe that studying abroad is the best way to receive a good education, while others think it is better to study in one’s own country. Discuss both views and give your own opinion.',
      'In many countries, people are spending more time on social media than talking to each other face to face. Do the advantages of this development outweigh the disadvantages?',
      'Some people think that governments should spend money on public transport rather than building more roads. To what extent do you agree or disagree?',
      'Many people now work from home rather than in an office. What are the advantages and disadvantages of this trend?',
      'Nowadays many young people leave school without any practical skills. What problems does this cause, and what can be done to solve them?',
      'Some people say that children should start learning a foreign language in primary school. To what extent do you agree or disagree?'].map(s=>'Write about the following topic:\n\n'+s+'\n\n'+WR_T2_END.trim()),
  gt1:['You recently bought a piece of equipment for your home, but it stopped working after a week.\nWrite a letter to the shop manager. In your letter:\n• describe the problem\n• explain what happened when you contacted the shop\n• say what you would like the manager to do\n\nWrite at least 150 words. You do NOT need to write any addresses.\nBegin your letter as follows: Dear Sir or Madam,',
       'A friend has invited you to stay at their home for a holiday next month, but you cannot go.\nWrite a letter to your friend. In your letter:\n• thank your friend for the invitation\n• explain why you cannot go\n• suggest another time to meet\n\nWrite at least 150 words. You do NOT need to write any addresses.\nBegin your letter as follows: Dear …,',
       'You work for a company and have noticed that the office is too noisy to work in.\nWrite a letter to your manager. In your letter:\n• describe the problem\n• explain how it affects your work\n• suggest what could be done\n\nWrite at least 150 words. You do NOT need to write any addresses.\nBegin your letter as follows: Dear Sir or Madam,']};
const WR_WORD=/[A-Za-z0-9]+(?:['’\-][A-Za-z0-9]+)*/g;
const wrWords=s=>((s||'').match(WR_WORD)||[]).length;
let wr={kind:'t2',q:'',essay:'',img:null,imgUrl:'',busy:false,err:'',cur:null,hist:false,why:{}};
try{const d=JSON.parse(localStorage.getItem('wr_draft')||'{}');if(WR_KINDS[d.kind])wr.kind=d.kind;wr.q=String(d.q||'');wr.essay=String(d.essay||'')}catch(e){}
const wrSaveDraft=()=>{try{localStorage.setItem('wr_draft',JSON.stringify({kind:wr.kind,q:wr.q,essay:wr.essay}))}catch(e){}};
function wrReset(){wr.cur=null;wr.hist=false;wr.err='';wr.why={}}

/* ---- Lịch sử Writing (IndexedDB, chỉ trên máy bạn) ---- */
const WR_HMAX=100;
const WRH={list:[],ready:false,err:false,db:null};
const wrdb=()=>WRH.db||(WRH.db=new Promise((ok,no)=>{try{const r=indexedDB.open('vocabook_wr',1);r.onupgradeneeded=()=>r.result.createObjectStore('h',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}));
const wrTx=(mode,fn)=>wrdb().then(d=>new Promise((ok,no)=>{const tx=d.transaction('h',mode);let o;try{o=fn(tx.objectStore('h'))}catch(e){no(e);return}tx.oncomplete=()=>ok(o&&o.result);tx.onerror=tx.onabort=()=>no(tx.error)}));
const wrL=()=>WRH.list.filter(r=>r.u===spUser());
function wrRefresh(){const a=document.activeElement&&document.activeElement.tagName;if(tab==='wr'&&!wr.busy&&a!=='INPUT'&&a!=='TEXTAREA'&&a!=='SELECT')render()}
wrTx('readonly',s=>s.getAll()).then(a=>{WRH.list=(a||[]).sort((x,y)=>y.t-x.t);WRH.ready=true;wrRefresh()}).catch(()=>{WRH.ready=true;WRH.err=true;wrRefresh()});
function wrHAdd(c){
  const rec={id:'w'+Date.now().toString(36)+uid(),t:Date.now(),u:spUser(),kind:c.kind,q:c.q,essay:c.essay,res:c.res};
  WRH.list=[rec,...WRH.list];c.id=rec.id;c.t=rec.t;
  wrTx('readwrite',s=>s.put(rec)).catch(()=>{WRH.err=true});
  if(WRH.list.length>WR_HMAX){const drop=WRH.list.slice(WR_HMAX);WRH.list=WRH.list.slice(0,WR_HMAX);wrTx('readwrite',s=>drop.forEach(x=>s.delete(x.id))).catch(()=>{})}
}
function wrHDel(id){
  if(!confirm('Xóa bài viết này khỏi lịch sử?'))return;
  WRH.list=WRH.list.filter(x=>x.id!==id);wrTx('readwrite',s=>s.delete(id)).catch(()=>{});
  if(wr.cur&&wr.cur.id===id)wr.cur=null;render();
}
function wrHClear(){
  const mine=wrL();if(!mine.length||!confirm('Xóa toàn bộ '+mine.length+' bài Writing đã lưu của bạn trên máy này?'))return;
  WRH.list=WRH.list.filter(x=>x.u!==spUser());wrTx('readwrite',s=>mine.forEach(x=>s.delete(x.id))).catch(()=>{});render();
}
async function wrHPurgeUser(u){
  const mine=WRH.list.filter(x=>x.u===u);WRH.list=WRH.list.filter(x=>x.u!==u);
  try{await wrTx('readwrite',s=>mine.forEach(x=>s.delete(x.id)))}catch(e){}
}
function wrOpen(id){
  const r=WRH.list.find(x=>x.id===id);if(!r)return;
  wr.cur={id:r.id,t:r.t,kind:r.kind,q:r.q,essay:r.essay,res:r.res};wr.why={};wr.err='';render();window.scrollTo(0,0);
}

/* ---- Nhập bài ---- */
function wrSetKind(k){wr.kind=k;wr.err='';wrSaveDraft();render()}
function wrSample(){
  const a=WR_SAMPLES[wr.kind];if(!a)return;
  let q;do{q=a[Math.floor(Math.random()*a.length)]}while(a.length>1&&q===wr.q);
  wr.q=q;wrSaveDraft();render();
}
function wrWc(){const n=wrWords(wr.essay),m=WR_KINDS[wr.kind].min;return{n,m,ok:n>=m}}
function wrCount(){
  const {n,m,ok}=wrWc(),e=$('#wr_wc'),b=$('#wr_go');
  if(e){e.textContent=n+' từ · tối thiểu '+m+(ok?' ✓':' (còn thiếu '+(m-n)+')');e.className='wcn '+(ok?'ok':'w')}
  if(b)b.disabled=wr.busy||n<30;
}
function wrPickImg(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  if(!/^image\//.test(f.type)){wr.err='Hãy chọn một file ảnh (JPG, PNG hoặc WEBP).';render();return}
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{   // thu nhỏ còn tối đa 1600px để gửi nhanh
    const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    c.toBlob(b=>{if(!b){wr.err='Không xử lý được ảnh này.';render();return}
      if(wr.imgUrl)URL.revokeObjectURL(wr.imgUrl);wr.img=b;wr.imgUrl=URL.createObjectURL(b);wr.err='';render()},'image/jpeg',.85)};
  im.onerror=()=>{URL.revokeObjectURL(url);wr.err='Không đọc được ảnh này.';render()};
  im.src=url;
}
function wrImgClear(){if(wr.imgUrl)URL.revokeObjectURL(wr.imgUrl);wr.img=null;wr.imgUrl='';render()}
function wrNew(){wr.q='';wr.essay='';wrImgClear();wr.cur=null;wr.hist=false;wr.err='';wr.why={};wrSaveDraft();render();window.scrollTo(0,0)}
function wrEdit(){const c=wr.cur;if(!c)return;wr.kind=c.kind;wr.q=c.q;wr.essay=c.essay;wr.cur=null;wr.hist=false;wr.why={};wrSaveDraft();render();window.scrollTo(0,0)}
async function wrSubmit(){
  if(wr.busy)return;
  const q=wr.q.trim(),e=wr.essay.trim();
  if(q.length<10){wr.err='Hãy nhập đề bài (ít nhất 10 ký tự).';render();return}
  if(wrWords(e)<30){wr.err='Bài viết quá ngắn, cần ít nhất 30 từ để chấm.';render();return}
  const kind=wr.kind;wr.busy=true;wr.err='';render();
  const fd=new FormData();fd.append('kind',kind);fd.append('question',q);fd.append('essay',e);
  if(kind==='ac1'&&wr.img)fd.append('image',wr.img,'chart.jpg');
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),180000);
  try{
    const res=await api('/writing/assess',{method:'POST',body:fd,signal:ctl.signal});
    const c={kind,q,essay:e,res};wrHAdd(c);wr.cur=c;wr.why={};
  }catch(er){
    if(er.net&&DEV_CFG)sp.cfg=true;
    if(!er.auth)wr.err='Không chấm được: '+(er.name==='AbortError'?'quá thời gian chờ':er.message);
  }
  clearTimeout(to);wr.busy=false;render();window.scrollTo(0,0);
}

/* ---- Giao diện ---- */
function vWr(){

/* ---- Nhập phụ đề: link YouTube, SRT/VTT, JSON (kể cả file xuất từ extension Shadowing Space) ---- */
function shVid(t){
  t=(t||'').trim();if(/^[\w-]{11}$/.test(t))return t;
  let u;try{u=new URL(/:\/\//.test(t)?t:'https://'+t)}catch(e){return null}
  const h=u.hostname.replace(/^www\./,'').toLowerCase(),p=u.pathname.split('/').filter(Boolean);let c='';
  if(h==='youtu.be')c=p[0]||'';
  else if(['youtube.com','m.youtube.com','music.youtube.com'].includes(h))c=u.pathname==='/watch'?(u.searchParams.get('v')||''):(['embed','shorts','live','v'].includes(p[0])?p[1]||'':'');
  return /^[\w-]{11}$/.test(c)?c:null;
}
const SH_END=/[.?!。？！…]["'”’)\]]*\s*$/;
function shMerge(c){   // gộp các dòng phụ đề thành câu: dừng ở dấu câu, quãng nghỉ >0,75s, dài >8s hoặc >220 ký tự
  const out=[];let b=[];
  const flush=()=>{if(b.length)out.push({s:b[0].s,e:b[b.length-1].e,en:b.map(x=>x.t).join(' '),vi:''})};
  for(const x of c){
    if(b.length){const p=b[b.length-1],len=b.reduce((a,y)=>a+y.t.length,0)+b.length+x.t.length;
      if(SH_END.test(p.t)||x.s-p.e>750||x.e-b[0].s>8000||len>220){flush();b=[]}}
    b.push(x);
  }
  flush();return out;
}
function shTs(s){
  const m=s.trim().replace(',','.').match(/^(?:(\d+):)?(\d+):(\d+)(?:\.(\d+))?$/);if(!m)return null;
  return((+(m[1]||0))*3600+(+m[2])*60+(+m[3]))*1000+Math.round(parseFloat('0.'+(m[4]||'0'))*1000);
}
const shDec=s=>s.replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').replace(/\[[^\]]{0,30}\]/g,' ').replace(/\s+/g,' ').trim();
function shParseCues(txt){
  const cues=[];
  for(const blk of txt.replace(/^\uFEFF/,'').replace(/\r/g,'').split(/\n\s*\n/)){
    const ls=blk.split('\n'),k=ls.findIndex(l=>l.includes('-->'));if(k<0)continue;
    const m=ls[k].match(/([\d:.,]+)\s*-->\s*([\d:.,]+)/);if(!m)continue;
    const s=shTs(m[1]),e=shTs(m[2]),t=shDec(ls.slice(k+1).join(' '));
    if(s==null||e==null||!t)continue;
    if(cues.length&&cues[cues.length-1].t===t&&s<=cues[cues.length-1].e){cues[cues.length-1].e=Math.max(cues[cues.length-1].e,e);continue}
    cues.push({s,e:Math.max(e,s+300),t});
  }
  cues.sort((a,b)=>a.s-b.s);
  for(let i=0;i<cues.length-1;i++)if(cues[i].e>cues[i+1].s)cues[i].e=Math.max(cues[i].s+300,cues[i+1].s);
  return cues;
}
function shParseAny(txt){   // -> {segs, vid?, title?}
  const t=txt.replace(/^\uFEFF/,'').trim();
  if(t[0]==='{'||t[0]==='['){
    let j;try{j=JSON.parse(t)}catch(e){throw new Error('Không đọc được JSON: '+e.message)}
    if(j&&j.payload)j=j.payload;
    const arr=Array.isArray(j)?j:(j&&j.segments);
    if(!Array.isArray(arr))throw new Error('JSON không có danh sách câu (segments).');
    const segs=arr.map(x=>({s:Math.round(x.startMs!=null?x.startMs:(x.start||0)*1000),e:Math.round(x.endMs!=null?x.endMs:(x.end||0)*1000),en:String(x.text||x.en||'').trim(),vi:String(x.vi||'').trim()})).filter(x=>x.en&&x.e>x.s);
    if(!segs.length)throw new Error('JSON không có câu hợp lệ.');
    segs.sort((a,b)=>a.s-b.s);
    return{segs,vid:j&&j.video&&j.video.videoId,title:j&&j.video&&j.video.title};
  }
  const c=shParseCues(t);if(!c.length)throw new Error('Không nhận ra phụ đề. Hãy dán nội dung file .srt / .vtt hoặc JSON.');
  return{segs:shMerge(c)};
}
function shAddLesson(o){
  const L={id:uid(),vid:o.vid,title:(o.title||'').trim()||'Bài shadowing',segs:o.segs,idx:0,best:{},t:Date.now()};

}
function shImport(){

  if(!SH.lessons.length&&!sh.add)h+=`<div class="empty">Chưa có bài shadowing nào. Nhấn dấu + để thêm video YouTube đầu tiên.</div>`;
  h+=SH.lessons.map(L=>{
    const done=Object.keys(L.best||{}).length;
    return `<div class="card shcard" onclick="shOpen('${L.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')shOpen('${L.id}')">
      <img class="shth" src="https://i.ytimg.com/vi/${esc(L.vid)}/mqdefault.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="shin"><b class="shct">${esc(L.title)}</b>
      <div class="mut" style="font-size:12px;margin-top:3px">${L.segs.length} câu · đang ở câu ${Math.min((L.idx||0)+1,L.segs.length)}${done?` · đã chấm ${done}`:''}</div></div>
      <button class="ib" onclick="event.stopPropagation();shDel('${L.id}')" aria-label="Xóa bài">${ic('trash',16)}</button></div>`;
  }).join('');
  if(!sh.add)h+=`<div class="hint">${ic('spark',16)}<span>Cách luyện: nghe một câu (có thể lặp nhiều lần, chậm lại), rồi bấm micro đọc nhại theo. Hệ thống chấm phát âm và chỉ ra từ cần sửa.</span></div>`;
  return h+`</div>`;
}

/* ---- Màn luyện ---- */
function vSh(){return sh.L?vShPractice():vShList()}
function vShPractice(){
  const L=sh.L;
  return `<div class="shbar">${ibtn('back','shClose()','Quay lại')}<b class="shtt">${esc(L.title)}</b><span class="shcnt" id="shcnt"></span></div>
  <div class="shbar" style="padding-top:0;justify-content:flex-end"><button class="shch" id="shtrb" onclick="sh.tr=!sh.tr;shCfgSave();shPaintTop();shNeedTr()">${ic('lang',14)}Bản dịch</button>
  <button class="shch" id="shspd" onclick="sh.set=true;shPaintPop()" aria-label="Tốc độ và lặp">${ic('sliders',14)}<span id="shspt"></span></button></div>
  <div id="shbox"><div id="shyt"></div><div id="shov"></div><div id="sherr"></div></div>
  <div class="shctl" id="shctl"></div><div id="shrec"></div>
  <div class="shl" id="shlist">${L.segs.map((sg,i)=>shItem(sg,i)).join('')}</div><div id="shpop"></div>`;
}
const shItem=(sg,i)=>{
  const b=(sh.L.best||{})[i];
  return `<div class="shi${i===sh.i?' on':''}" id="shi${i}" onclick="shSel(${i},true)"><div class="shen">${esc(sg.en)}${b!=null?`<span class="shsc ${b>=80?'g':b>=60?'y':'r'}">${Math.round(b)}</span>`:''}</div><div class="shvi" id="shv${i}">${esc(sg.vi||'')}</div></div>`;
};
function shOpen(id){
  const L=SH.lessons.find(x=>x.id===id);if(!L)return;
  shLeave();sh.L=L;sh.i=Math.min(L.idx||0,L.segs.length-1);sh.recs={};sh.res={};sh.msg='';sh.err='';sh.set=false;
  if(tab!=='sh')tab='sh';render();window.scrollTo(0,0);
}
function shClose(){shLeave();sh.L=null;render()}
function shAfter(){
  if(!sh.L)return;
  shPaintAll();shMount();
  const el=$('#shi'+sh.i);if(el)el.scrollIntoView({block:'center'});
}
function shLeave(){
  sh.tok++;clearInterval(sh.w);
  if(sh.rec){sh.cancel=true;try{sh.mr.stop()}catch(e){}}
  if(sh.aud){try{sh.aud.pause()}catch(e){}sh.aud=null}
  if(sh.pl){try{sh.pl.destroy()}catch(e){}}
  sh.pl=null;sh.ready=false;sh.playing=false;
  Object.values(sh.recs).forEach(r=>{try{URL.revokeObjectURL(r.url)}catch(e){}});
}
/* trình phát YouTube */
let ytP=null;
function ytLoad(){
  if(window.YT&&YT.Player)return Promise.resolve();
  if(ytP)return ytP;
  ytP=new Promise((ok,no)=>{
    const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.async=true;
    s.onerror=()=>{ytP=null;s.remove();no(new Error('Không tải được trình phát YouTube. Kiểm tra kết nối mạng.'))};
    const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{prev&&prev();ok()};
    document.head.appendChild(s);
    setTimeout(()=>{if(!(window.YT&&YT.Player)){ytP=null;no(new Error('Quá thời gian tải trình phát YouTube.'))}},12000);
  });
  return ytP;
}
function shMount(){
  const L=sh.L;if(!L)return;
  try{if(sh.pl&&sh.pl.getIframe&&document.body.contains(sh.pl.getIframe()))return}catch(e){}
  if(!$('#shyt'))return;
  if(sh.pl){try{sh.pl.destroy()}catch(e){}sh.pl=null}sh.ready=false;
  ytLoad().then(()=>{
    const el=$('#shyt');if(!el||sh.L!==L)return;
    sh.pl=new YT.Player(el,{videoId:L.vid,playerVars:{playsinline:1,rel:0,controls:0,disablekb:1,modestbranding:1,iv_load_policy:3,cc_load_policy:0,fs:0},
      events:{
        onReady:()=>{sh.ready=true;try{sh.pl.cueVideoById({videoId:L.vid,startSeconds:L.segs[sh.i].s/1000})}catch(e){}},
        onStateChange:e=>{sh.playing=e.data===1;shPaintCtl()},
        onError:()=>{sh.err='Video này không cho phát nhúng hoặc không còn khả dụng.';shPaintErr()}
      }});
  }).catch(e=>{sh.err=e.message;shPaintErr()});
}
/* phát một câu: seek -> phát -> dừng đúng cuối câu -> lặp theo số lần chọn */
function shClearW(){sh.tok++;clearInterval(sh.w);sh.w=null}
function shPlay(i){
  if(i!=null&&i!==sh.i)shSel(i,false);
  if(!sh.ready){sh.err='Trình phát đang tải, hãy thử lại sau giây lát.';shPaintErr();return}
  shStopRec(true);shStopAud();sh.err='';shPaintErr();sh.k=0;shRun();
}
function shRun(){
  const sg=sh.L.segs[sh.i],p=sh.pl,tok=(sh.tok=sh.tok+1),t0=Date.now();clearInterval(sh.w);
  try{p.setPlaybackRate(shSnap(sh.speed));p.seekTo(sg.s/1000,true);p.playVideo()}catch(e){return}
  let seen=false;const maxMs=(sg.e-sg.s)/Math.max(sh.speed,.25)+3000;
  sh.w=setInterval(()=>{
    if(tok!==sh.tok){clearInterval(sh.w);return}
    let t;try{t=p.getCurrentTime()*1000}catch(e){return}
    if(!seen){if(t>=sg.s-400&&t<sg.e)seen=true;else if(Date.now()-t0<maxMs)return}
    if(t+60>=sg.e||Date.now()-t0>maxMs){
      clearInterval(sh.w);try{p.pauseVideo()}catch(e){}
      sh.k++;
      if(sh.k<sh.rep)setTimeout(()=>{if(tok===sh.tok)shRun()},300);
      else{sh.playing=false;shPaintCtl();if(sh.auto)setTimeout(()=>{if(tok===sh.tok)shRecStart(true)},200)}
    }
  },80);
}
function shStopPlay(){shClearW();try{sh.pl&&sh.pl.pauseVideo()}catch(e){}sh.playing=false;shPaintCtl()}
function shToggle(){if(sh.playing)shStopPlay();else shPlay()}
function shSel(i,play){
  const L=sh.L;if(!L||i<0||i>=L.segs.length)return;
  const same=i===sh.i;
  shStopRec(true);shStopAud();if(!same||!play)shStopPlay();
  sh.i=i;L.idx=i;shSave();sh.msg='';
  shPaintAll();const el=$('#shi'+i);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
  if(play)shPlay();
  else if(sh.ready){try{sh.pl.seekTo(L.segs[i].s/1000,true);sh.pl.pauseVideo()}catch(e){}}
}
const shGo=d=>shSel(sh.i+d,true);

/* ---- ghi âm + chấm ---- */
function shStopAud(){if(sh.aud){try{sh.aud.pause()}catch(e){}sh.aud=null}}
function shStopRec(cancel){if(sh.rec){if(cancel)sh.cancel=true;try{sh.mr.stop()}catch(e){}}}
async function shRecToggle(){if(sh.rec){shStopRec(false);return}shRecStart(false)}
async function shRecStart(auto){
  if(sh.rec||sh.scoring)return;
  shStopPlay();shStopAud();
  const i=sh.i,sg=sh.L.segs[i];
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];
    const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
    const mr=sh.mr=new MediaRecorder(st,mt?{mimeType:mt}:{});
    mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
    mr.onstop=()=>{
      st.getTracks().forEach(t=>t.stop());clearTimeout(sh.rto);sh.rec=false;
      if(sh.cancel){sh.cancel=false;shPaintRec();return}
      const blob=new Blob(ch,{type:mr.mimeType||mt||'audio/webm'});
      if(sh.recs[i])try{URL.revokeObjectURL(sh.recs[i].url)}catch(e){}
      sh.recs[i]={blob,url:URL.createObjectURL(blob)};delete sh.res[i];sh.msg='';
      shPaintRec();
      if(AU)shScore(i,blob);
    };
    mr.start();sh.rec=true;sh.msg='';sh.cancel=false;
    sh.rto=setTimeout(()=>{if(mr.state==='recording')mr.stop()},Math.min(40000,(sg.e-sg.s)/Math.max(sh.speed,.25)*1.25+2500));
    shPaintRec();
  }catch(e){sh.msg='Không mở được micro. Hãy cho phép quyền micro (trang phải chạy bằng HTTPS).';shPaintRec()}
}
async function shScore(i,blob){
  const L=sh.L,sg=L.segs[i];sh.scoring=true;sh.ahead=null;sh.msg='';shPaintRec();
  const fd=new FormData();fd.append('file',blob,'s.'+(blob.type.includes('mp4')?'m4a':'webm'));fd.append('text',sg.en);
  try{
    const job=await api('/assess/sentence',{method:'POST',body:fd});
    let r=null;
    for(let n=0,nf=0;n<90&&!r;n++){
      await new Promise(o=>setTimeout(o,1500));if(sh.L!==L)return;
      let q;try{q=await api('/assess/'+job.job_id);nf=0}catch(e){if(e.net&&++nf<6)continue;throw e}
      if(q.status==='done')r=q.result;
      else if(q.status==='error')throw new Error(q.error||'Chấm thất bại');
      else if(q.ahead!==sh.ahead){sh.ahead=q.ahead;if(sh.i===i)shPaintRec()}
    }
    if(!r)throw new Error('quá thời gian chờ');
    sh.res[i]=r;if(L.best[i]==null||r.score>L.best[i]){L.best[i]=r.score;shSave();const el=$('#shi'+i);if(el)el.outerHTML=shItem(sg,i)}
  }catch(e){if(!e.auth)sh.msg='Không chấm được: '+e.message}
  sh.scoring=false;if(sh.L===L)shPaintRec();
}
function shPlayMine(){
  const r=sh.recs[sh.i];if(!r)return;shStopPlay();shStopAud();
  sh.aud=new Audio(r.url);sh.aud.play().catch(()=>{});
}

/* ---- dịch từng câu khi YouTube không có bản dịch ---- */
async function shNeedTr(){
  if(!sh.tr||sh.trBusy||sh.trOff||!sh.L)return;
  const L=sh.L;sh.trBusy=true;
  try{
    for(let j=Math.max(0,sh.i-1);j<Math.min(L.segs.length,sh.i+4);j++){
      const sg=L.segs[j];if(sg.vi||sg.vx)continue;
      let v=await tr(sg.en);
      if(/MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(v)){sh.trOff=true;break}
      sg.vi=v;if(!v)sg.vx=1;
      const el=$('#shv'+j);if(el&&sh.L===L)el.textContent=v;
      if(sh.L!==L)break;
    }
    shSave();
  }catch(e){}
  sh.trBusy=false;
}

/* ---- vẽ lại từng phần (không render() lại cả trang, để trình phát không bị hủy) ---- */
function shPaintAll(){
  const L=sh.L;if(!L)return;
  shPaintTop();shPaintCtl();shPaintRec();shPaintErr();shPaintPop();
  document.querySelectorAll('#shlist .shi.on').forEach(e=>e.classList.remove('on'));
  const el=$('#shi'+sh.i);if(el)el.classList.add('on');
  shNeedTr();
}
function shPaintTop(){
  const L=sh.L;if(!L)return;
  const c=$('#shcnt');if(c)c.textContent=`Câu ${sh.i+1} / ${L.segs.length}`;
  const b=$('#shtrb');if(b)b.classList.toggle('on',sh.tr);
  const l=$('#shlist');if(l)l.classList.toggle('notr',!sh.tr);
  const s=$('#shspt');if(s)s.textContent=`${shFmt(sh.speed)}× · ×${sh.rep}`;
  const o=$('#shov');if(o)o.innerHTML=`<span>${esc(L.segs[sh.i].en)}</span>`;
}
function shPaintCtl(){
  const e=$('#shctl');if(!e)return;
  e.innerHTML=`<button class="shcb" onclick="shGo(-1)" aria-label="Câu trước" ${sh.i<=0?'disabled':''}>${ic('chevup',20)}</button>
  <button class="shcb big" onclick="shToggle()" aria-label="${sh.playing?'Dừng':'Nghe câu này'}">${ic(sh.playing?'stop':'play',22)}</button>
  <button class="shcb${sh.rec?' rec':''}" style="${sh.rec?'color:#fff;border:0':''}" onclick="shRecToggle()" ${sh.scoring?'disabled':''} aria-label="${sh.rec?'Dừng ghi âm':'Ghi âm nhại theo'}">${ic(sh.rec?'stop':'mic',20)}</button>
  <button class="shcb" onclick="shGo(1)" aria-label="Câu sau" ${sh.i>=sh.L.segs.length-1?'disabled':''}>${ic('down',20)}</button>`;
}
function shPaintErr(){const e=$('#sherr');if(e)e.innerHTML=sh.err?`<div class="sherr">${esc(sh.err)}</div>`:''}
function shPaintRec(){
  const e=$('#shrec');if(!e)return;shPaintCtl();
  const i=sh.i,r=sh.recs[i],res=sh.res[i];let h='';
  if(sh.rec)h=`<div class="shrb"><span class="shdot"></span>Đang ghi âm… đọc nhại theo câu vừa nghe. Nhấn nút vuông để dừng.</div>`;
  else if(sh.scoring)h=`<div class="shrb">Đang chấm phát âm…${sh.ahead?` (còn ${sh.ahead} bài phía trước)`:''}</div>`;
  else{
    if(r)h+=`<div class="shrb"><button class="lnk" onclick="shPlayMine()">${ic('play',13)} Nghe bản ghi của bạn</button><button class="lnk" onclick="shPlay()">${ic('vol',14)} Nghe mẫu</button></div>`;
    else h+=`<div class="shrb mut">Nghe câu rồi bấm micro để đọc nhại. ${AU?'':'Đăng nhập ở tab Speaking để được chấm điểm.'}</div>`;
    if(r&&!AU)h+=`<div class="shrb mut">Đăng nhập ở tab Speaking để chấm điểm phát âm; bạn vẫn có thể tự so sánh bằng cách nghe lại.</div>`;
    if(res){
      const cls=res.score>=80?'g':res.score>=60?'y':'r';
      h+=`<div class="shres"><div class="shscore ${cls}">${Math.round(res.score)}<small>/100</small></div><div class="shwd">${res.words.map((w,k)=>`<b class="${w.sev==null?'o':'s'+w.sev}" onclick="speak(this.dataset.w)" data-w="${esc(w.w.replace(/[^A-Za-z']/g,''))}">${esc(w.w)}</b>`).join(' ')}</div>
      <p class="mut" style="font-size:11.5px;margin:8px 0 0">${res.ok?'Phát âm tốt!':'Từ màu đỏ/vàng cần luyện thêm — chạm vào từ để nghe mẫu.'}</p></div>`;
    }
  }
  if(sh.msg)h+=`<p class="err" style="margin:6px 16px 0">${esc(sh.msg)}</p>`;
  e.innerHTML=h;
}
function shPaintPop(){
  const e=$('#shpop');if(!e)return;
  if(!sh.set){e.innerHTML='';return}
  const sg=(arr,cur,fn,fmt)=>`<div class="seg in">${arr.map(v=>`<button class="${v===cur?'on':''}" onclick="${fn}(${v})">${fmt(v)}</button>`).join('')}</div>`;
  e.innerHTML=`<div class="ov" onclick="if(event.target===this){sh.set=false;shPaintPop()}"><div class="mdl" style="text-align:left" role="dialog" aria-modal="true" aria-label="Tốc độ và lặp">
  <button class="xb mx" onclick="sh.set=false;shPaintPop()" aria-label="Đóng">${ic('x',18)}</button>
  <b style="font-size:15px">Cài đặt luyện tập</b>
  <div class="fl" style="margin:14px 0 6px">Tốc độ phát</div>${sg(SH_SPEEDS,sh.speed,'shSetSpeed',v=>shFmt(v)+'×')}
  <div class="fl" style="margin:14px 0 6px">Số lần lặp mỗi câu</div>${sg(SH_REPS,sh.rep,'shSetRep',v=>'×'+v)}
  <label class="shsw"><span>Tự ghi âm sau khi nghe xong<small class="mut">Nghe → nhại theo ngay, không cần bấm micro</small></span><input type="checkbox" ${sh.auto?'checked':''} onchange="sh.auto=this.checked;shCfgSave()"></label>
  <label class="shsw"><span>Hiện bản dịch tiếng Việt</span><input type="checkbox" ${sh.tr?'checked':''} onchange="sh.tr=this.checked;shCfgSave();shPaintTop();shNeedTr()"></label>
  </div></div>`;
}
const shSetSpeed=v=>{sh.speed=v;shCfgSave();shPaintTop();shPaintPop()};
const shSetRep=v=>{sh.rep=v;shCfgSave();shPaintTop();shPaintPop()};
/* phím tắt trên máy tính: Space nghe, ↑/↓ đổi câu, R ghi âm */
addEventListener('keydown',e=>{
  if(tab!=='sh'||!sh.L||sh.set||e.ctrlKey||e.metaKey||e.altKey)return;
  const t=(e.target&&e.target.tagName)||'';if(/INPUT|TEXTAREA|SELECT|BUTTON/.test(t))return;
  if(e.key===' '){e.preventDefault();shToggle()}
  else if(e.key==='ArrowDown'){e.preventDefault();shGo(1)}
  else if(e.key==='ArrowUp'){e.preventDefault();shGo(-1)}
  else if(e.key==='r'||e.key==='R'){e.preventDefault();shRecToggle()}
});

render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
