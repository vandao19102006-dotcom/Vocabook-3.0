<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VocaBook">
<title>VocaBook</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#5b52c8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{
 --bg:#f4f5fb;--card:#fff;--tx:#1f2240;--mut:#7a7f99;--bd:#e6e8f2;
 --pri:#5b52c8;--btn:#5b52c8;--hero:#5b52c8;--tint:#efedfc;--tintb:#dedaf8;--seg:#e9eaf4;
 --ok:#1f9a73;--okbg:#e7f6f0;--okb:#a7dcc8;
 --bad:#dd5468;--badbg:#fdecef;--badb:#f3b5bf;
 --warn:#d98a1f;--warnbg:#fdf1de;--warnb:#f1d29b;
 color-scheme:light;
}
@media(prefers-color-scheme:dark){
 :root:not([data-theme="light"]){--bg:#0f1120;--card:#1a1d31;--tx:#eef0fb;--mut:#9aa0ba;--bd:#2b3048;--pri:#9189ff;--btn:#6a61e0;--hero:#4a42ad;--tint:#252949;--tintb:#3a3f6b;--seg:#23273f;--ok:#38c397;--okbg:#16322a;--okb:#2a6a55;--bad:#ff8497;--badbg:#3a1f28;--badb:#6b3040;--warn:#f0b45d;--warnbg:#3a2d18;--warnb:#6b5428;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f1120;--card:#1a1d31;--tx:#eef0fb;--mut:#9aa0ba;--bd:#2b3048;--pri:#9189ff;--btn:#6a61e0;--hero:#4a42ad;--tint:#252949;--tintb:#3a3f6b;--seg:#23273f;--ok:#38c397;--okbg:#16322a;--okb:#2a6a55;--bad:#ff8497;--badbg:#3a1f28;--badb:#6b3040;--warn:#f0b45d;--warnbg:#3a2d18;--warnb:#6b5428;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 14px/1.5 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 calc(86px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font-family:inherit}
button{font-size:inherit;border:0;background:none;color:inherit;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.ic{flex:none;display:block}
#app{max-width:520px;margin:0 auto}

/* ---------- header ---------- */
.top{padding:16px 20px 2px}
.brand{display:flex;align-items:center;gap:6px;color:var(--pri);font-size:11px;font-weight:700;margin-bottom:8px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.4px}
.ib{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--bd);color:var(--mut);display:grid;place-items:center;flex:none}
.ib.on{color:var(--pri);border-color:var(--pri)}
.pg{padding:14px 20px 24px}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(31,34,64,.04)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--btn);color:#fff;border-radius:14px;padding:15px 18px;font-weight:700;font-size:14px;box-shadow:0 6px 16px rgba(91,82,200,.22);transition:transform .15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5;box-shadow:none}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.bad{background:var(--bad)}
.btn.sm{padding:11px 16px;font-size:13px;width:auto}
.lnk{display:inline-flex;align-items:center;gap:5px;color:var(--pri);font-weight:600;font-size:12px}
.lnk:disabled{opacity:.45}
.mut{color:var(--mut)}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--pri);white-space:nowrap}
.lv{display:inline-block;font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.lv0{background:var(--badbg);color:var(--bad)}.lv1{background:var(--tint);color:var(--pri)}.lv2{background:var(--warnbg);color:var(--warn)}.lv3{background:var(--okbg);color:var(--ok)}
.lab{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}
.sub{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11.5px;color:var(--mut);margin:10px 2px 16px}
.dir{color:var(--pri);font-weight:600}
.msg{font-size:12px;color:var(--mut);margin:0 2px 14px}
.hint{display:flex;gap:10px;align-items:flex-start;color:var(--mut);font-size:12px;background:var(--card);border:1px dashed var(--bd);border-radius:14px;padding:14px}
.hint .ic{color:var(--pri)}
.err{color:var(--bad);font-size:12.5px;margin:0 0 12px}
.empty{padding:26px 16px;text-align:center;color:var(--mut);font-size:12.5px}
.note{display:flex;gap:8px;align-items:flex-start;color:var(--mut);font-size:11.5px;margin-top:14px}
.note .ic{margin-top:1px}

/* ---------- fields ---------- */
.sb{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:0 14px;height:48px}
.sb:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px rgba(91,82,200,.13)}
.sb input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;color:var(--tx);font:inherit;font-weight:600;padding:0;margin:0}
.sb input::placeholder{color:var(--mut);font-weight:500}
.sb .si{color:var(--pri);display:grid;place-items:center}
.sb .clr{color:var(--mut);display:grid;place-items:center}
.sb input:placeholder-shown~.clr{display:none}
.sb.sm{height:44px;margin-bottom:12px}
.sb.sm .si{color:var(--mut)}
.sb .fl-b{display:grid;place-items:center;color:var(--mut);width:30px;height:30px;border-radius:9px}
.sb .fl-b.on{background:var(--tint);color:var(--pri)}
.fl{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-bottom:5px}
input.f,textarea.f{width:100%;background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;color:var(--tx);margin:0 0 12px;outline:none;transition:border-color .15s}
input.f:focus,textarea.f:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(91,82,200,.13)}
input.f:disabled{opacity:.7}
.sel{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:0 14px;height:48px;color:var(--pri);min-width:0}
.sel select{flex:1;min-width:0;height:100%;appearance:none;-webkit-appearance:none;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-weight:600;padding:0}
.sel select:disabled{opacity:.6}
.sel .cv{color:var(--mut)}
.sel option{color:#1f2240}
.seg{display:flex;gap:2px;background:var(--seg);border-radius:12px;padding:3px;margin-bottom:6px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 5px rgba(31,34,64,.12)}
.seg button:disabled{opacity:.5}

/* ---------- tra từ ---------- */
.wc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wd{font-size:26px;font-weight:700;letter-spacing:-.3px;line-height:1.2;overflow-wrap:anywhere}
.ipa{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--mut);font-size:12px;margin-top:8px}
.spk{width:38px;height:38px;border-radius:50%;background:var(--tint);color:var(--pri);display:grid;place-items:center;flex:none}
.card hr{border:0;border-top:1px solid var(--bd);margin:16px 0}
.vi{font-size:19px;font-weight:600;line-height:1.35}
.en{color:var(--mut);font-size:13px;margin:8px 0 0}
.exb{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:14px}
.exq{font-weight:600;font-size:13px}.exv{color:var(--mut);font-size:12px;margin-top:4px}
.rt-r{text-align:right;margin-top:14px}
.rt-r .lnk+.lnk{margin-left:16px}
.alts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.alts button{background:transparent;border:1px solid var(--bd);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--tx)}
.alts button.on{border-color:var(--pri);color:var(--pri)}
.out{margin:18px 2px 8px}

/* ---------- sổ tay ---------- */
.sr{display:flex;gap:10px;margin-bottom:14px}
.sr .sel{flex:1;background:var(--tint);border-color:var(--tintb)}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:0 14px;font-weight:600;font-size:12.5px;height:48px;white-space:nowrap}
.chip.on{border-color:var(--pri);color:var(--pri)}
.hero{background:var(--hero);color:#fff;border-radius:20px;padding:18px;margin-bottom:20px;box-shadow:0 10px 24px rgba(91,82,200,.25)}
.hero h3{margin:0;font-size:16px;font-weight:700}
.hero p{margin:3px 0 16px;font-size:11.5px;opacity:.82}
.stats{display:flex;gap:28px;margin-bottom:18px}
.stats b{display:block;font-size:24px;font-weight:700;line-height:1.1}
.stats span{font-size:10.5px;opacity:.82}
.hero .btn{background:#ecebfb;color:#4a41b3;box-shadow:none;padding:13px}
.hero .btn:disabled{opacity:.55}
.sh{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
.sh h3{font-size:14px;font-weight:700;margin:0}
.wl{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.wr{border-bottom:1px solid var(--bd)}.wr:last-child{border:0}
.wr-b{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;text-align:left}
.wr-t{min-width:0}
.wr-w{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.wr-v{font-size:12px;color:var(--mut);overflow-wrap:anywhere}
.wr-d{padding:0 14px 14px;font-size:12.5px;color:var(--mut)}
.wr-d p{margin:0 0 6px}
.wr-a{display:flex;gap:16px;margin-top:10px}
.wr-a .del{color:var(--bad)}
.ft{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:12px}
.ft .grp{display:flex;gap:14px;align-items:center;color:var(--mut)}

/* ---------- flashcard ---------- */
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 2px 8px}
.prow b{font-size:13px;font-weight:700}
.prow span{color:var(--mut);font-size:11.5px;display:inline-flex;align-items:center;gap:5px}
.prow span.g{color:var(--ok);font-weight:600}
.pbar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:14px}
.pbar i{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width .3s}
.fcd{padding:16px 18px 18px;text-align:center;cursor:pointer;min-height:300px;display:flex;flex-direction:column}
.fc-top{display:flex;justify-content:space-between;align-items:center}
.fc-w{font-size:32px;font-weight:700;letter-spacing:-.5px;margin-top:28px;line-height:1.2;overflow-wrap:anywhere}
.fc-i{color:var(--mut);font-size:12px;margin-top:8px}
.fc-vi{font-size:18px;font-weight:600;line-height:1.4}
.fc-ex{font-size:12px;color:var(--mut);margin:12px 0 0}
.fc-h{margin-top:auto;padding-top:18px}
.ask{text-align:center;font-weight:700;font-size:13px;margin:8px 0 12px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rb{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 6px;border-radius:14px;border:1px solid;text-align:center}
.rb b{font-size:12px;font-weight:700}
.rb small{font-size:10px;font-weight:500;opacity:.8}
.rb.bad{background:var(--badbg);color:var(--bad);border-color:var(--badb)}
.rb.mid{background:var(--warnbg);color:var(--warn);border-color:var(--warnb)}
.rb.ok{background:var(--okbg);color:var(--ok);border-color:var(--okb)}
.rate.off .rb{opacity:.4;pointer-events:none}
.big{font-size:34px;font-weight:700;letter-spacing:-.6px;line-height:1.1}
.cen{text-align:center}
.done-i{width:46px;height:46px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}

/* ---------- bài tập ---------- */
.qc{background:var(--tint);border:1px solid var(--tintb);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.tg{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--card);color:var(--pri);border:1px solid var(--tintb)}
.qc-w{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.qw{font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.25;overflow-wrap:anywhere;white-space:pre-line}
.qw.sm{font-size:16px;line-height:1.6;font-weight:600;letter-spacing:0}
.qp{color:var(--mut);font-size:12px;margin:8px 0 0}
.qc .spk{background:var(--card)}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-weight:600;font-size:13.5px;color:var(--tx)}
.op span{flex:1;min-width:0;overflow-wrap:anywhere}
.op .lt{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--mut);flex:none}
.op:disabled{opacity:.6}
.op.r,.op.x{opacity:1}
.op.r{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.op.r .lt{background:var(--ok);color:#fff}
.op.x{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.op.x .lt{background:var(--bad);color:#fff}
.fb{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border-radius:14px;margin:4px 0 14px;font-size:12.5px;border:1px solid}
.fb b{display:block;font-size:13px;margin-bottom:2px}
.fb span{color:var(--tx);opacity:.85;overflow-wrap:anywhere}
.fb.ok{background:var(--okbg);color:var(--ok);border-color:var(--okb)}
.fb.no{background:var(--badbg);color:var(--bad);border-color:var(--badb)}
.more{text-align:center;margin-top:14px}
.rr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.rr:last-child{border:0}

/* ---------- speaking ---------- */
.strip{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ok);font-weight:600;margin:2px 2px 14px}
.strip .lnk{margin-left:auto}
.sq{font-size:17px;font-weight:700;line-height:1.45;margin:12px 0 0;overflow-wrap:anywhere}
.sq.q{white-space:pre-line}
.sy{font-size:12px;color:var(--mut);margin:14px 0 6px}
.cue{margin:0;padding-left:18px;font-size:13px;font-weight:600}
.cue li{margin-bottom:4px}
.prep{display:flex;gap:6px;align-items:center;color:var(--pri);font-size:11.5px;font-weight:600;margin-top:14px}
.micw{text-align:center;padding:10px 0 6px}
.mic{width:76px;height:76px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 10px 24px rgba(91,82,200,.35)}
.mic:disabled{opacity:.5;box-shadow:none}
.mic.rec{background:var(--bad);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(221,84,104,.45)}100%{box-shadow:0 0 0 24px rgba(221,84,104,0)}}
.micw b{display:block;font-size:13px;font-weight:700}
.micw p{margin:4px 0 0;font-size:11.5px;color:var(--mut)}
.tm{font-size:28px;font-weight:700;margin-bottom:12px;font-variant-numeric:tabular-nums}
.spin{width:30px;height:30px;border:3px solid var(--tintb);border-top-color:var(--pri);border-radius:50%;margin:4px auto 14px;animation:spn .9s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.last{display:flex;gap:16px;align-items:center;background:var(--tint);border-radius:16px;padding:14px 16px}
.band{text-align:center;min-width:56px}
.band b{display:block;font-size:30px;font-weight:700;color:var(--pri);line-height:1}
.band small{display:block;font-size:8.5px;color:var(--mut);margin-top:5px;font-weight:700;letter-spacing:.4px}
.band.xl b{font-size:46px}
.crit{margin-bottom:12px}
.crit .row{justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.crit b{font-weight:700}
.crit .pbar{margin:0}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border:0}
.li>div{min-width:0;overflow-wrap:anywhere}
.xb{color:var(--mut);padding:6px 8px;display:grid;place-items:center}
.card p{margin:0 0 8px}
.card p:last-child{margin-bottom:0}
.card .t{font-weight:700;font-size:14px;margin-bottom:8px;display:block}

/* chi tiết phát âm + cửa sổ luyện từ */
.dv{line-height:1.95;font-size:14px;overflow-wrap:anywhere}
.del{color:var(--bad)}.ins{color:var(--ok);font-weight:600}
.why{display:block;font-size:12px;color:var(--mut);background:var(--tint);border-radius:10px;padding:8px 10px;margin:4px 0}
.pw{font:inherit;font-weight:600;padding:0}
.w0{border-bottom:2px dotted var(--mut)}.w1{color:var(--warn);border-bottom:2px solid var(--warn)}.w2{color:var(--bad);border-bottom:2px solid var(--bad)}
.ipc{font:600 11px ui-monospace,Menlo,monospace;background:var(--okbg);color:var(--ok);border-radius:6px;padding:1px 6px}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:14px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,12,30,.55);display:grid;place-items:center;padding:20px}
.mdl{position:relative;width:min(100%,420px);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px 18px 18px;text-align:center}
.mx{position:absolute;right:6px;top:6px}
.pbox{background:var(--tint);border-radius:14px;padding:12px;margin:14px 0}
.pr{display:flex;align-items:center;gap:10px;margin-top:8px}
.pr>span{width:40px;text-align:left;color:var(--mut);font-weight:700;font-size:10.5px}
.pr>div{flex:1;display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center}
.pr b{font:600 17px ui-monospace,Menlo,monospace}
.po{color:var(--ok)}.px{color:var(--bad);text-decoration:underline wavy}
.seg.in{margin:0 0 12px}

/* ---------- nav ---------- */
nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);background:var(--card);border-top:1px solid var(--bd);display:flex;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;color:var(--mut);font-size:10px;font-weight:600}
nav button.on{color:var(--pri);background:var(--tint)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shadowing ---------- */
.shbar{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.shtt{flex:1;min-width:0;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shcnt{font-size:11.5px;color:var(--mut);font-weight:600;white-space:nowrap}
.shch{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--bd);background:var(--card);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.shch.on{background:var(--tint);border-color:var(--tintb);color:var(--pri)}
#shbox{position:relative;margin:0 16px;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}
#shbox iframe,#shyt{position:absolute;inset:0;width:100%;height:100%;border:0}
#shov{position:absolute;left:8px;right:8px;bottom:10px;text-align:center;pointer-events:none;z-index:2}
#shov span{background:rgba(0,0,0,.74);color:#fff;font-weight:600;font-size:13px;line-height:1.7;padding:2px 8px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sherr{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:20px;text-align:center;background:rgba(0,0,0,.78);color:#fff;font-weight:600;font-size:13px}
.shctl{display:flex;justify-content:center;align-items:center;gap:16px;padding:14px 16px 4px}
.shcb{width:46px;height:46px;border-radius:50%;border:1px solid var(--tintb);background:var(--card);color:var(--pri);display:grid;place-items:center}
.shcb:disabled{opacity:.4}
.shcb.big{width:58px;height:58px;background:var(--btn);color:#fff;border:0;box-shadow:0 6px 16px rgba(91,82,200,.25)}
.shcb.rec{background:var(--bad)}
.shrb{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 18px;padding:8px 16px 0;font-size:12.5px;font-weight:600;text-align:center}
.shdot{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:shp 1s infinite}
@keyframes shp{50%{opacity:.25}}
.shres{margin:10px 16px 0;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:16px;text-align:center}
.shscore{font-size:34px;font-weight:800;line-height:1.1}.shscore small{font-size:13px;font-weight:600;color:var(--mut)}
.shscore.g,.shsc.g{color:var(--ok)}.shscore.y,.shsc.y{color:var(--warn)}.shscore.r,.shsc.r{color:var(--bad)}
.shwd{margin-top:8px;font-size:15px;line-height:1.9}
.shwd b{cursor:pointer;padding:1px 4px;border-radius:6px;font-weight:600}
.shwd b.s2{background:var(--badbg);color:var(--bad)}.shwd b.s1{background:var(--warnbg);color:var(--warn)}.shwd b.s0{text-decoration:underline dotted var(--mut)}
.shl{padding:14px 12px 24px}
.shi{padding:12px 14px;border-radius:14px;cursor:pointer;margin-bottom:2px}
.shi.on{background:var(--tint)}
.shen{font-size:14.5px;font-weight:600;line-height:1.45}.shi.on .shen{font-size:16px}
.shsc{margin-left:8px;font-size:11px;font-weight:700}
.shvi{font-size:12.5px;color:var(--mut);margin-top:3px;font-weight:500}.shvi:empty{display:none}
.shl.notr .shvi{display:none}
.shcard{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer}
.shth{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--seg);flex:none}
.shin{flex:1;min-width:0}
.shct{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;line-height:1.35}
.shsep{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--mut);font-size:11.5px;font-weight:600}
.shsep:before,.shsep:after{content:"";flex:1;height:1px;background:var(--bd)}
.shsw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:13px;font-weight:600}
.shsw small{display:block;font-size:11.5px;font-weight:500;margin-top:2px}
.shsw input{width:20px;height:20px;accent-color:var(--pri);flex:none}

/* Speaking: tạm dừng, chọn câu, lịch sử */
.mrow{display:flex;justify-content:center;align-items:center;gap:22px;margin-bottom:14px}.mrow .mic{margin:0}
.mic.pz{width:56px;height:56px;background:var(--tint);color:var(--pri);box-shadow:none;border:1px solid var(--tintb)}
.mic.rec.ps{animation:none;opacity:.9}.tm.ps{color:var(--warn)}
.pqs{max-height:340px;overflow:auto;margin-top:10px}
.pqi{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:8px;font-size:13px}
.pqi.on{border-color:var(--pri);background:var(--tint)}
.pqi .q{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;min-width:0}
.pqi .pill{flex:none}
.qh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--mut);margin:-4px 2px 14px}
.hgb{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;color:var(--tx)}
.hgq{font-size:13.5px;font-weight:600;margin:6px 0 4px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hga{margin-top:10px;border-top:1px solid var(--bd)}
.plw{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.plb{width:36px;height:36px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;flex:none}
.plw input[type=range]{flex:1;min-width:0;accent-color:var(--pri)}
.plt{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.wcn{font-size:12px;margin:6px 2px 14px;font-weight:600}.wcn.ok{color:var(--ok)}.wcn.w{color:var(--warn)}
.wrq{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" aria-label="Điều hướng chính"></nav>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
let S={nbs:[{id:'n1',name:'Sổ tay chung'}],words:[],cur:'all'};
try{const r=localStorage.getItem('eng_v1');if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem('eng_v1',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const uid=()=>Math.random().toString(36).slice(2,9);
const DAY=864e5,IV=[0,1,2,4,8,16];

/* ---- Icon set (nét 2px, 24x24) ---- */
const IC={
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 book:'<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
 vol:'<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 down:'<path d="m6 9 6 6 6-6"/>',
 pen:'<path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
 layers:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/>',
 clip:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
 mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>',
 stop:'<rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/>',
 redo:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
 minus:'<path d="M5 12h14"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 sliders:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
 dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
 spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4M17 5h4"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 shuf:'<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
 shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
 arrow:'<path d="M5 12h14M12 5l7 7-7 7"/>',
 sort:'<path d="m3 16 4 4 4-4M7 20V4M21 8l-4-4-4 4M17 4v16"/>',
 play:'<path d="M7 4v16l13-8z" fill="currentColor"/>',
pause:'<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',
head:'<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',
back:'<path d="m15 18-6-6 6-6"/>',
chevup:'<path d="m18 15-6-6-6 6"/>',
lang:'<path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/>'
};
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ---- Dữ liệu học ---- */
const LV=[['Chưa thuộc','lv0',b=>b===0],['Đang học','lv1',b=>b>=1&&b<=2],['Khá thuộc','lv2',b=>b>=3&&b<=4],['Đã thuộc','lv3',b=>b===5]];
const lvName=b=>LV.find(l=>l[2](b))[0];
const lvCls=b=>LV.find(l=>l[2](b))[1];
const pool=()=>S.words.filter(w=>S.cur==='all'||w.nb===S.cur);
const nbName=id=>(S.nbs.find(n=>n.id===id)||{}).name||'?';
const scopeName=()=>S.cur==='all'?'Tất cả sổ tay':nbName(S.cur);
// độ ưu tiên: từ càng chưa thuộc càng dễ xuất hiện
const wt=w=>Math.pow(6-w.box,2)+(w.seen?0:4)+(w.seen&&w.ok/w.seen<.5?3:0);
function wpick(a,n){return a.map(x=>({x,k:Math.random()**(1/wt(x))})).sort((p,q)=>q.k-p.k).slice(0,n).map(o=>o.x)}
function grade(w,r){w.seen++;if(r===0)w.box=0;else if(r===1)w.box=Math.max(1,w.box);else{w.box=Math.min(5,w.box+1);w.ok++}w.due=Date.now()+IV[w.box]*DAY;save()}
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(o=>o[1]);
const hasEx=w=>!!(w.ex&&new RegExp(reEsc(w.w),'i').test(w.ex));

/* ---- Trạng thái giao diện ---- */
let tab='look',draft=null,msg='',busy=false,qv='',editing=false,dnb=null;
let fc={q:[],i:0,f:false,due:false},ex=null,exMode='mc',exErr='';
let viewNb='all',nbq='',nbSort='new',nbF=-1,openW=null,nbAdd=false;
// Thanh dưới: 3 mục. "Từ vựng" gồm Sổ tay / Flashcard / Bài tập; "Speaking" gồm Luyện nói / Shadowing.
const TABS=[['look','search','Tra từ'],['vo','book','Từ vựng'],['sp','mic','Speaking'],['wr','pen','Writing']];
const GRP={look:'look',nb:'vo',fc:'vo',ex:'vo',sp:'sp',sh:'sp',wr:'wr'};
const SUBS={vo:[['nb','Sổ tay'],['fc','Flashcard'],['ex','Bài tập']],sp:[['sp','Luyện nói'],['sh','Shadowing']]};
const lastIn={vo:'nb',sp:'sp'};
function goG(g){go(lastIn[g]||g)}
const subnav=()=>{const s=SUBS[GRP[tab]];return s?`<div class="pg" style="padding-top:0;padding-bottom:0"><div class="seg" role="tablist">${s.map(x=>`<button class="${tab===x[0]?'on':''}" role="tab" aria-selected="${tab===x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div></div>`:''};
function go(t){if(tab==='sh'&&t!=='sh')shLeave();tab=t;if(lastIn[GRP[t]]!==undefined)lastIn[GRP[t]]=t;render();window.scrollTo(0,0);if(t==='sp')spLoadQs()}

/* ---- Thành phần dùng chung ---- */
const head=(t,r='')=>`<div class="top"><div class="brand">${ic('book',14)}VocaBook</div><div class="hd"><h1>${t}</h1>${r}</div></div>`+subnav();
const ibtn=(i,click,title,on)=>`<button class="ib${on?' on':''}" onclick="${click}" aria-label="${title}" title="${title}">${ic(i,18)}</button>`;
const spk=t=>`<button class="spk" data-t="${esc(t)}" onclick="event.stopPropagation();speak(this.dataset.t)" aria-label="Nghe phát âm">${ic('vol',18)}</button>`;
const nbOpts=(sel,all)=>(all?`<option value="all"${sel==='all'?' selected':''}>Tất cả sổ tay</option>`:'')+S.nbs.map(n=>`<option value="${n.id}"${sel===n.id?' selected':''}>${esc(n.name)}</option>`).join('');
const scopeRow=()=>`<label class="sel">${ic('book',16)}<select aria-label="Phạm vi ôn tập" onchange="S.cur=this.value;save();fc={q:[],i:0,f:false,due:false};ex=null;exErr='';render()">${nbOpts(S.cur,true)}</select><span class="cv">${ic('down',16)}</span></label>`;

function render(){
  $('#nav').innerHTML=TABS.map(t=>{const on=GRP[tab]===t[0];return `<button class="${on?'on':''}" onclick="goG('${t[0]}')" ${on?'aria-current="page"':''}>${ic(t[1],20)}${t[2]}</button>`}).join('');
  $('#app').innerHTML={look:vLook,nb:vNb,fc:vFc,ex:vEx,sp:vSp,sh:vSh,wr:vWr}[tab]();
  if(tab==='sh')shAfter();
}

/* ================= Tra từ ================= */
function vLook(){
  dnb=S.nbs.some(n=>n.id===dnb)?dnb:S.nbs[0].id;
  let h=head('Tra từ')+`<div class="pg">`;
  h+=`<div class="sb"><button class="si" onclick="lookup()" aria-label="Tra từ">${ic('search',18)}</button><input id="q" value="${esc(qv)}" placeholder="Nhập từ hoặc cụm từ tiếng Anh" oninput="qv=this.value" onkeydown="if(event.key==='Enter')lookup()" autocapitalize="off" autocomplete="off" enterkeyhint="search"><button class="clr" onclick="qv='';draft=null;msg='';editing=false;render();$('#q').focus()" aria-label="Xóa">${ic('x',16)}</button></div>
  <div class="sub"><span>Từ hoặc cụm từ tiếng Anh</span><b class="dir">Anh → Việt</b></div>`;
  if(busy)h+=`<p class="msg">Đang tra…</p>`;
  else if(msg)h+=`<p class="msg">${esc(msg)}</p>`;
  if(draft){
    const d=draft;
    h+=`<div class="card">`;
    if(!editing){
      h+=`<div class="wc-h"><div><div class="wd">${esc(d.word)}</div><div class="ipa">${d.ipa?`<span>${esc(d.ipa)}</span>`:''}${d.pos?`<span class="pill">${esc(d.pos)}</span>`:''}</div></div>${spk(d.word)}</div>
      <hr><div class="lab">Nghĩa tiếng Việt</div><div class="vi">${d.vi?esc(d.vi):'<span class="mut">Chưa có nghĩa, hãy chỉnh sửa để nhập</span>'}</div>
      ${d.alts&&d.alts.length?`<div class="alts" role="group" aria-label="Nghĩa khác">${d.alts.map((a,i)=>`<button class="${viHas(d,a)?'on':''}" onclick="togVi(${i})">${viHas(d,a)?'✓ ':'+ '}${esc(a)}</button>`).join('')}</div>`:''}
      ${d.en?`<p class="en">${esc(d.en)}</p>`:''}
      ${d.ex?`<div class="exb"><div class="exq">“${esc(d.ex)}”</div>${d.exvi?`<div class="exv">${esc(d.exvi)}</div>`:''}</div>`:''}
      <div class="rt-r">${d.senses&&d.senses.length>1?`<button class="lnk" onclick="nextSense()">${ic('shuf',13)} Định nghĩa khác (${d.si+1}/${d.senses.length})</button>`:''}<button class="lnk" onclick="editing=true;render()">${ic('pen',13)} Chỉnh sửa trước khi lưu</button></div>`;
    }else{
      const f=(k,l,v)=>`<label class="fl" for="d_${k}">${l}</label><input class="f" id="d_${k}" value="${esc(v)}" oninput="draft.${k}=this.value">`;
      h+=f('word','Từ',d.word)+`<div class="row"><div style="flex:1">${f('ipa','Phiên âm',d.ipa)}</div><div style="flex:1">${f('pos','Loại từ',d.pos)}</div></div>`
        +f('vi','Nghĩa tiếng Việt',d.vi)+f('en','Định nghĩa tiếng Anh',d.en)+f('ex','Ví dụ',d.ex)+f('exvi','Dịch ví dụ',d.exvi)
        +`<div class="rt-r" style="margin-top:2px"><button class="lnk" onclick="editing=false;render()">${ic('check',13)} Xong</button></div>`;
    }
    h+=`</div><div class="lab out">Lưu vào sổ tay</div>
    <label class="sel" style="margin-bottom:14px">${ic('book',16)}<select aria-label="Sổ tay" onchange="dnb=this.value">${nbOpts(dnb)}</select><span class="cv">${ic('down',16)}</span></label>
    <button class="btn" onclick="saveWord()">${ic('plus',18)} Lưu từ vào sổ tay</button>`;
  }else if(!busy&&!msg){
    h+=`<div class="hint">${ic('spark',16)}<span>Gõ một từ rồi nhấn Enter. Bạn có thể sửa nghĩa trước khi lưu vào sổ tay.</span></div>`;
  }
  return h+`</div>`;
}
const J=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.json()};
// Dịch Anh→Việt. trG: Google Translate (kèm danh sách nghĩa xếp theo độ phổ biến, nên "school" ra "trường học" chứ không phải "đàn cá").
// Lỗi/hết lượt thì trM (MyMemory) làm dự phòng.
const trG=async t=>{try{
  const d=await J('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&dt=bd&q='+encodeURIComponent(t));
  const main=(d[0]||[]).map(x=>(x&&x[0])||'').join('').trim();
  const alts=[];for(const e of d[1]||[])for(const w of e[1]||[])if(w&&!alts.includes(w))alts.push(w);
  return main?{main,alts,pos:((d[1]||[])[0]||[])[0]||''}:null}catch(e){return null}};
const trM=async t=>{try{const d=await J('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair=en|vi');return d.responseData.translatedText||''}catch(e){return ''}};
const tr=async t=>{const g=await trG(t);return g?g.main:await trM(t)};
const viParts=d=>(d.vi||'').split(/\s*[,;]\s*/).filter(Boolean);
const viHas=(d,a)=>viParts(d).some(p=>p.toLowerCase()===a.toLowerCase());
function togVi(i){const d=draft;if(!d||!d.alts||!d.alts[i])return;const a=d.alts[i],p=viParts(d),k=p.findIndex(x=>x.toLowerCase()===a.toLowerCase());
  if(k>=0)p.splice(k,1);else p.push(a);d.vi=p.join(', ');render()}
async function nextSense(){
  const d=draft;if(!d||!d.senses||d.senses.length<2||busy)return;
  d.si=(d.si+1)%d.senses.length;const s=d.senses[d.si];
  d.pos=s.pos||d.pos;d.en=s.en;d.ex=s.ex;d.exvi='';busy=true;render();
  const v=s.ex?await tr(s.ex):'';
  if(draft===d){d.exvi=v;busy=false;render()}
}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
async function lookup(){
  const w=($('#q')?$('#q').value:qv).trim();if(!w)return;
  qv=w;busy=true;msg='';draft=null;editing=false;render();
  const d={word:w,ipa:'',pos:'',vi:'',en:'',ex:'',exvi:'',alts:[],senses:[],si:0};let miss=[];
  const gp=trG(w);   // dịch song song với việc tra từ điển
  try{
    const es=await J('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));
    const r=es[0];
    d.word=r.word||w;
    for(const e of es){const t=e.phonetic||((e.phonetics||[]).find(p=>p.text)||{}).text;if(t){d.ipa=t;break}}
    // Từ điển trả nhiều mục (mỗi nguồn gốc từ một mục) và mục đầu thường là nghĩa hiếm ("school" = đàn cá).
    // Gom hết các nghĩa; nghĩa cùng loại từ với bản dịch và thuộc mục có nhiều định nghĩa nhất (thường là nghĩa chính) đứng trước.
    const all=[];
    for(const e of es){const n=(e.meanings||[]).reduce((a,m)=>a+(m.definitions||[]).length,0);
      for(const m of e.meanings||[])for(const df of(m.definitions||[]).slice(0,2))
        if(df.definition)all.push({pos:m.partOfSpeech||'',en:df.definition,ex:df.example||'',n})}
    const g0=await gp;const gpos=g0?g0.pos:'';
    all.sort((a,b)=>((b.pos===gpos)-(a.pos===gpos))||(b.n-a.n));
    d.senses=all.slice(0,8);
    const s=d.senses[0];
    if(s){d.pos=s.pos;d.en=s.en;d.ex=s.ex||((d.senses.find(x=>x.ex&&x.pos===s.pos)||{}).ex||'')}
  }catch(e){miss.push('từ điển tiếng Anh')}
  const g=await gp;
  if(g){d.vi=g.main;d.alts=g.alts.filter(a=>a.toLowerCase()!==g.main.toLowerCase()).slice(0,8)}
  else d.vi=await trM(w);
  if(!d.vi)miss.push('nghĩa tiếng Việt');
  if(d.ex)d.exvi=await tr(d.ex);
  draft=d;msg=miss.length?'Không lấy được: '+miss.join(', ')+'. Bạn hãy tự nhập phần thiếu.':'Nghĩa tiếng Việt do dịch tự động, hãy kiểm tra trước khi lưu.';
  if(miss.length)editing=true;
  busy=false;render();
}
function saveWord(){
  const d=draft;if(!d)return;
  const w=(d.word||'').trim(),vi=(d.vi||'').trim();
  if(!w||!vi){msg='Cần có từ và nghĩa tiếng Việt.';editing=true;render();return}
  const nb=S.nbs.some(n=>n.id===dnb)?dnb:S.nbs[0].id;
  let o=S.words.find(x=>x.nb===nb&&x.w.toLowerCase()===w.toLowerCase());
  const f={w,ipa:(d.ipa||'').trim(),pos:(d.pos||'').trim(),vi,en:(d.en||'').trim(),ex:(d.ex||'').trim(),exvi:(d.exvi||'').trim()};
  if(o)Object.assign(o,f);else S.words.push({id:uid(),nb,box:0,seen:0,ok:0,due:0,t:Date.now(),...f});
  save();draft=null;editing=false;qv='';msg=`Đã lưu “${w}” vào ${nbName(nb)}.`;render();
}

function ivLabel(w,r){

}

const flip=()=>{fc.f=!fc.f;render()};
function startFc(){const ws=pool(),due=ws.filter(w=>w.due<=Date.now());if(!ws.length){render();return}fc={q:wpick(due.length?due:ws,20),i:0,f:false,due:due.length>0};render()}
function rate(r){if(!fc.f)return;grade(fc.q[fc.i],r);fc.i++;fc.f=false;render()}

/* ================= Bài tập ================= */
function mkQ(w,ws,mode){
  const others=()=>shuf(ws.filter(x=>x.id!==w.id));
  const t=mode==='mc'?(Math.random()<.5?'mc1':'mc2'):mode;
  if(t==='mc1')return{w,t,tag:'Chọn nghĩa đúng',p:'Từ này có nghĩa là gì trong tiếng Việt?',big:w.w,spk:w.w,opts:shuf([w.vi,...others().slice(0,3).map(x=>x.vi)]),a:w.vi};
  if(t==='mc2')return{w,t,tag:'Chọn từ đúng',p:'Từ tiếng Anh nào có nghĩa này?',big:w.vi,opts:shuf([w.w,...others().slice(0,3).map(x=>x.w)]),a:w.w};
  if(t==='fill')return{w,t,tag:'Điền từ còn thiếu',p:'Điền từ còn thiếu vào chỗ trống.',big:w.ex.replace(new RegExp(reEsc(w.w),'ig'),'____'),hint:w.exvi,a:w.w};
  return{w,t:'type',tag:'Gõ từ tiếng Anh',p:'Gõ từ tiếng Anh có nghĩa này.',big:w.vi,hint:w.ipa?'Phiên âm: '+w.ipa:'',a:w.w};
}
function vEx(){
  const ws=pool();
  let h=head('Luyện từ vựng',ex&&ex.i<ex.q.length?ibtn('redo','startEx()','Làm bài mới'):'')+`<div class="pg">
  <div class="seg" role="tablist">${[['mc','Trắc nghiệm'],['fill','Điền từ'],['type','Gõ từ']].map(([k,n])=>`<button role="tab" aria-selected="${exMode===k}" class="${exMode===k?'on':''}" onclick="setMode('${k}')">${n}</button>`).join('')}</div>`;
  if(!ws.length)return h+`<div style="height:12px"></div>${scopeRow()}<div class="card cen" style="margin-top:14px"><p class="mut">Chưa có từ nào trong phạm vi này.</p></div></div>`;
  if(!ex){
    const info={mc:'Chọn nghĩa hoặc từ đúng trong 4 đáp án.',fill:'Điền từ còn thiếu vào câu ví dụ.',type:'Gõ từ tiếng Anh từ nghĩa tiếng Việt.'}[exMode];
    return h+`<div style="height:12px"></div>${scopeRow()}<div class="card cen" style="margin-top:14px"><b class="t">10 câu hỏi</b><p class="mut" style="margin-bottom:16px">${info} Từ chưa thuộc sẽ xuất hiện nhiều hơn.</p>${exErr?`<p class="err">${esc(exErr)}</p>`:''}<button class="btn" onclick="startEx()">${ic('clip',18)} Bắt đầu làm bài</button></div></div>`;
  }
  if(ex.i>=ex.q.length){
    const done=ex.q.filter(q=>q.done),bad=done.filter(q=>!q.ok);
    return h+`<div style="height:12px"></div><div class="card cen"><div class="big" style="color:var(--pri)">${ex.score}/${done.length}</div><p class="mut" style="margin:6px 0 0">${done.length?Math.round(ex.score/done.length*100)+'% câu đúng':'Bạn chưa trả lời câu nào'}</p></div>
    ${bad.length?`<div class="card"><b class="t">Cần ôn lại</b>${bad.map(q=>`<div class="rr"><b>${esc(q.w.w)}</b><span class="mut">${esc(q.w.vi)}</span></div>`).join('')}</div>`:(done.length?`<div class="fb ok">${ic('spark',18)}<div><b>Tuyệt vời!</b><span>Bạn đúng hết các câu đã làm.</span></div></div>`:'')}
    ${scopeRow()}<div style="height:14px"></div><button class="btn" onclick="startEx()">${ic('redo',18)} Làm bài mới</button></div>`;
  }
  const q=ex.q[ex.i],n=ex.q.length,wrong=ex.q.filter(x=>x.done&&!x.ok).length;
  h+=`<div class="prow"><b>Câu ${ex.i+1} / ${n}</b><span class="g">${ic('check',13)} ${ex.score} đúng · ${wrong} cần ôn</span></div><div class="pbar"><i style="width:${(ex.i+1)/n*100}%"></i></div>
  <p class="msg" style="margin-top:-4px">${esc(scopeName())} · Ưu tiên từ khó</p>
  <div class="qc"><span class="tg">${q.tag}</span><div class="qc-w"><span class="qw${q.t==='fill'?' sm':''}">${esc(q.big)}</span>${q.spk?spk(q.spk):''}</div><p class="qp">${q.p}</p>${q.hint?`<p class="qp">${esc(q.hint)}</p>`:''}</div>`;
  if(q.opts)h+=q.opts.map((o,k)=>{let c='op',m='';if(q.done){if(o===q.a){c+=' r';m=ic('check',18)}else if(o===q.pick){c+=' x';m=ic('x',18)}}
    return `<button class="${c}" ${q.done?'disabled':''} onclick="pickA(${k})"><i class="lt">${'ABCD'[k]}</i><span>${esc(o)}</span>${m}</button>`}).join('');
  else h+=`<input class="f" id="ans" aria-label="Câu trả lời" placeholder="Nhập câu trả lời" autocomplete="off" autocapitalize="off" ${q.done?'disabled':''} value="${esc(q.pick||'')}" onkeydown="if(event.key==='Enter')typeA()">`+(q.done?'':`<button class="btn" onclick="typeA()">Kiểm tra</button>`);
  if(q.done){
    h+=q.ok?`<div class="fb ok">${ic('spark',18)}<div><b>Chính xác! Bạn đang tiến bộ.</b><span>“${esc(q.w.w)}” nghĩa là ${esc(q.w.vi)}.</span></div></div>`
           :`<div class="fb no">${ic('x',18)}<div><b>Chưa đúng</b><span>Đáp án: <b style="display:inline">${esc(q.a)}</b>${q.a!==q.w.vi?` (${esc(q.w.vi)})`:''}. Hãy nhớ từ này nhé.</span></div></div>`;
    h+=`<button class="btn" onclick="ex.i++;render()">${ex.i+1<n?'Câu tiếp theo':'Xem kết quả'} ${ic('arrow',18)}</button>`;
    if(ex.i+1<n)h+=`<div class="more"><button class="lnk" onclick="ex.i=ex.q.length;render()">Kết thúc &amp; xem kết quả</button></div>`;
  }
  return h+`</div>`;
}
function setMode(k){const had=!!ex;exMode=k;ex=null;exErr='';if(had)startEx();else render()}
function startEx(){
  const ws=pool();let cand=ws,err='';
  if(exMode==='mc'&&ws.length<4)err='Trắc nghiệm cần ít nhất 4 từ trong phạm vi này.';
  if(exMode==='fill'){cand=ws.filter(hasEx);if(!cand.length)err='Chưa có từ nào có câu ví dụ chứa chính từ đó.'}
  if(err){ex=null;exErr=err;render();return}
  exErr='';ex={q:wpick(cand,Math.min(10,cand.length)).map(w=>mkQ(w,ws,exMode)),i:0,score:0};render();
}
function fin(q,pick,ok){q.pick=pick;q.ok=ok;q.done=true;if(ok)ex.score++;grade(q.w,ok?2:0);render()}
function pickA(k){const q=ex.q[ex.i];if(q.done)return;fin(q,q.opts[k],q.opts[k]===q.a)}
function typeA(){const q=ex.q[ex.i];if(q.done)return;const v=$('#ans').value.trim();fin(q,v,v.toLowerCase()===q.a.toLowerCase())}

/* ================= Speaking (IELTS) ================= */
const SPQ_DEF={
 1:['Do you work or are you a student?','What do you usually do in your free time?','Tell me about your hometown.','Do you prefer staying at home or going out in the evening? Why?'],
 2:['Describe a book you have enjoyed reading. You should say: what it is, who wrote it, what it is about, and explain why you enjoyed it.','Describe a place you visited that you would like to go back to. You should say: where it is, when you went, what you did there, and explain why you want to return.','Describe a person who has influenced you. You should say: who the person is, how you know them, what they did, and explain how they influenced you.'],
 3:['Why do you think people read fewer books nowadays?','How has technology changed the way people travel?','Do you think children should learn from role models? Why or why not?']
};
// Câu hỏi dạng {id,text}. Nếu chưa tải được từ máy chủ thì dùng bản lưu gần nhất hoặc bộ mặc định.
const toQ=o=>{const r={};[1,2,3].forEach(p=>r[p]=(o[p]||[]).map(x=>typeof x==='string'?{id:null,text:x}:x));return r};
let SPQ=toQ(SPQ_DEF);
try{const c=JSON.parse(localStorage.getItem('sp_qs')||'null');if(c)SPQ=toQ(c)}catch(e){}
let sp={part:1,qi:0,rec:false,busy:false,res:null,err:'',t0:0,mr:null,chunks:[],timer:null,cfg:false,hist:false,blob:null,buf:null,why:{},paused:false,acc:0,seg:0,bag:{},picker:false,qh:false,hx:{},review:false,hrec:null,hmore:false};
sp.qi=Math.floor(Math.random()*((SPQ[1]||[]).length||1));   // bắt đầu bằng một câu ngẫu nhiên
let wm=null;                                          // cửa sổ luyện phát âm một từ
let au={mode:'login',user:'',err:'',busy:false};      // form đăng nhập / đăng ký
let adm={open:false,part:1,draft:'',edit:null,msg:'',bulk:false,bdraft:''}; // bảng quản lý câu hỏi (admin)
const CFG_URL=(window.VOCABOOK_API_URL||'').trim();           // đặt trong config.js
const SP_DEFAULT={url:CFG_URL||'http://127.0.0.1:8000'};
const DEV_CFG=!CFG_URL;                                        // chưa có config.js => hiện ô nhập địa chỉ máy chủ
const spCfg=()=>{let s={};try{s=JSON.parse(localStorage.getItem('sp_cfg')||'{}')}catch(e){}
  return{url:(DEV_CFG&&s.url)||SP_DEFAULT.url}};
function spSaveCfg(){try{localStorage.setItem('sp_cfg',JSON.stringify({url:$('#sp_url').value.trim()}))}catch(e){}}
const bnd=n=>n==null?'–':Number(n).toFixed(1);
const curQ=()=>{const qs=SPQ[sp.part]||[];return qs.length?qs[sp.qi%qs.length]:null};

/* ---- Lịch sử Speaking: lưu đầy đủ kết quả + bản ghi âm trong IndexedDB (chỉ nằm trên máy bạn) ---- */
const SP_HMAX=80;                       // giữ tối đa 80 bài gần nhất
const SPH={list:[],ready:false,err:false,db:null};
const spdb=()=>SPH.db||(SPH.db=new Promise((ok,no)=>{try{const r=indexedDB.open('vocabook_sp',1);r.onupgradeneeded=()=>r.result.createObjectStore('h',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}));
const spHTx=(mode,fn)=>spdb().then(d=>new Promise((ok,no)=>{const tx=d.transaction('h',mode);let o;try{o=fn(tx.objectStore('h'))}catch(e){no(e);return}tx.oncomplete=()=>ok(o&&o.result);tx.onerror=tx.onabort=()=>no(tx.error)}));
const spClean=r=>{const {impBusy,impErr,...c}=r;return c};
const spUser=()=>AU&&AU.user?AU.user.username:'';
const spL=()=>SPH.list.filter(r=>r.u===spUser());          // lịch sử của tài khoản đang đăng nhập
const spKey=q=>q.id!=null?'i'+q.id:'t'+q.text;
const spFmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const spEl=()=>sp.acc+(sp.rec&&!sp.paused?Date.now()-sp.seg:0);   // thời gian đã ghi (không tính lúc tạm dừng)
const spDt=t=>new Date(t).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function spHLoad(){
  spHTx('readonly',s=>s.getAll()).then(a=>{SPH.list=(a||[]).sort((x,y)=>y.t-x.t);SPH.ready=true;spHRefresh()})
    .catch(()=>{SPH.ready=true;SPH.err=true;spHRefresh()});
}
function spHRefresh(){const a=document.activeElement&&document.activeElement.tagName;if(tab==='sp'&&!sp.rec&&!sp.busy&&a!=='INPUT'&&a!=='TEXTAREA'&&a!=='SELECT')render()}
async function spHPut(rec){
  const c={...rec,res:spClean(rec.res)};
  try{await spHTx('readwrite',s=>s.put(c))}
  catch(e){if(c.blob){try{await spHTx('readwrite',s=>s.put({...c,blob:null}))}catch(x){SPH.err=true}}else SPH.err=true}
}
function spHAdd(q,blob){
  const res=sp.res,rec={id:res.jobId||('h'+Date.now()),t:Date.now(),u:spUser(),part:sp.part,qkey:q?spKey(q):'',q:q?q.text:'',dur:res.duration||0,res,blob};
  SPH.list=[rec,...SPH.list.filter(x=>x.id!==rec.id)];sp.hrec=rec;
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  spHPut(rec);
  if(SPH.list.length>SP_HMAX){const drop=SPH.list.slice(SP_HMAX);SPH.list=SPH.list.slice(0,SP_HMAX);spHTx('readwrite',s=>drop.forEach(x=>s.delete(x.id))).catch(()=>{})}
}
function spHDel(id){
  if(!confirm('Xóa bài nói này khỏi lịch sử (cả bản ghi âm)?'))return;
  SPH.list=SPH.list.filter(x=>x.id!==id);spHTx('readwrite',s=>s.delete(id)).catch(()=>{});
  if(sp.hrec&&sp.hrec.id===id){spBackH();return}
  render();
}
function spHClear(){
  const mine=spL();if(!mine.length||!confirm('Xóa toàn bộ '+mine.length+' bài nói đã lưu của bạn trên máy này?'))return;
  SPH.list=SPH.list.filter(x=>x.u!==spUser());spHTx('readwrite',s=>mine.forEach(x=>s.delete(x.id))).catch(()=>{});render();
}
async function spHPurgeUser(u){
  const mine=SPH.list.filter(x=>x.u===u);SPH.list=SPH.list.filter(x=>x.u!==u);
  try{await spHTx('readwrite',s=>mine.forEach(x=>s.delete(x.id)))}catch(e){}
}
function spStats(){const st={};spL().forEach(r=>{const s=st[r.qkey]||(st[r.qkey]={n:0,best:0});s.n++;s.best=Math.max(s.best,r.res.overall||0)});return st}
spHLoad();

/* ---- Chọn câu hỏi: ngẫu nhiên (xáo trộn, không lặp cho tới khi hết lượt) hoặc chọn từ danh sách ---- */
function spReset(){plStop(true);sp.res=null;sp.err='';sp.blob=sp.buf=null;sp.hrec=null;sp.why={};sp.qh=false;stopPlay();wmClose()}
function spPart(p){const n=(SPQ[p]||[]).length;sp.part=p;sp.qi=n?Math.floor(Math.random()*n):0;sp.picker=false;spReset();render()}
function spRandQ(){
  const qs=SPQ[sp.part]||[];if(qs.length<2)return;
  const cq=curQ(),ck=cq?spKey(cq):'',keys=qs.map(spKey);
  let bag=(sp.bag[sp.part]||[]).filter(k=>keys.includes(k)&&k!==ck);
  if(!bag.length){bag=keys.filter(k=>k!==ck);for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}
  const k=bag.shift();sp.bag[sp.part]=bag;sp.qi=Math.max(0,keys.indexOf(k));sp.picker=false;spReset();render();
}
function spPick(i){sp.qi=i;sp.picker=false;spReset();render();window.scrollTo(0,0)}
function spFilterQ(v){v=v.trim().toLowerCase();document.querySelectorAll('#pqlist .pqi').forEach(b=>{b.style.display=(!v||b.dataset.s.includes(v))?'':'none'})}
const spQMain=q=>{const cu=spCues(q);return cu?cu.main:q};
function spPicker(){
  const qs=SPQ[sp.part]||[],st=spStats(),ck=curQ()?spKey(curQ()):'';
  return `<div class="card"><b class="t">Chọn câu hỏi · Part ${sp.part} (${qs.length} câu)</b>
  ${qs.length>6?`<input class="f" style="margin:0" placeholder="Tìm câu hỏi…" oninput="spFilterQ(this.value)" autocapitalize="off">`:''}
  <div class="pqs" id="pqlist">${qs.map((q,i)=>{const s=st[spKey(q)];
    return `<button class="pqi${spKey(q)===ck?' on':''}" data-s="${esc(q.text.toLowerCase())}" onclick="spPick(${i})"><span class="q">${esc(spQMain(q.text))}</span><span class="pill">${s?s.n+' lần · '+bnd(s.best):'Chưa nói'}</span></button>`}).join('')}</div></div>`;
}

/* ---- Ghi âm: tạm dừng / tiếp tục ---- */
function spPause(){
  if(!sp.rec||!sp.mr)return;
  try{
    if(sp.mr.state==='recording'){sp.mr.pause();sp.acc+=Date.now()-sp.seg;sp.paused=true}
    else if(sp.mr.state==='paused'){sp.mr.resume();sp.seg=Date.now();sp.paused=false}
  }catch(e){sp.err='Thiết bị này không hỗ trợ tạm dừng ghi âm.'}
  render();
}
function spMicHtml(q){
  if(!sp.rec)return `<button class="mic" ${q?'':'disabled'} onclick="spToggle()" aria-label="Bắt đầu ghi âm">${ic('mic',28)}</button><b>Chạm để bắt đầu nói</b><p>Cho phép micro để ghi âm và nhận góp ý.</p>`;
  const ps=sp.paused,can=sp.mr&&typeof sp.mr.pause==='function';
  return `<div id="sptime" class="tm${ps?' ps':''}">${spFmt(spEl())}</div>
  <div class="mrow">${can?`<button class="mic pz" onclick="spPause()" aria-label="${ps?'Tiếp tục ghi âm':'Tạm dừng ghi âm'}">${ic(ps?'play':'pause',22)}</button>`:''}<button class="mic rec${ps?' ps':''}" onclick="spToggle()" aria-label="Dừng và chấm điểm">${ic('stop',28)}</button></div>
  <b>Chạm nút vuông để dừng và chấm điểm</b><p>${ps?'Đang tạm dừng · chạm nút ▶ để nói tiếp':(can?'Đang ghi âm… chạm nút ⏸ nếu cần dừng tạm':'Đang ghi âm…')}</p>`;
}

/* ---- Giao diện lịch sử ---- */
const spAtt=r=>{const B=r.res.bands||{};return `<div class="li"><div><b>Band ${bnd(r.res.overall)}</b> · ${spDt(r.t)}${r.dur?' · '+Math.round(r.dur)+'s':''}<br><span class="mut" style="font-size:11.5px">F ${bnd(B.fluency)} · L ${bnd(B.lexical)} · G ${bnd(B.grammar)} · P ${bnd(B.pronunciation)}${r.res.imp?' · có bản cải thiện':''}</span></div>
  <div class="row" style="flex:none;gap:14px"><button class="lnk" data-id="${esc(r.id)}" onclick="spOpenH(this.dataset.id)">${ic('play',13)} Xem lại</button><button class="lnk" style="color:var(--bad)" data-id="${esc(r.id)}" onclick="spHDel(this.dataset.id)" aria-label="Xóa bài này">${ic('trash',14)}</button></div></div>`};
function spQHist(q){   // dòng "đã nói câu này n lần" dưới câu hỏi hiện tại
  if(!q)return '';const rs=spL().filter(r=>r.qkey===spKey(q));if(!rs.length)return '';
  const best=Math.max(...rs.map(r=>r.res.overall||0));
  return `<div class="qh"><span>Đã nói câu này ${rs.length} lần · cao nhất band ${bnd(best)}</span><button class="lnk" onclick="sp.qh=!sp.qh;render()">${sp.qh?'Thu gọn':'Xem lại bài cũ'}</button></div>`
    +(sp.qh?`<div class="card" style="padding:4px 16px">${rs.map(spAtt).join('')}</div>`:'');
}
function spGx(k){sp.hx[k]=!sp.hx[k];render()}
function vSpHist(){
  if(!SPH.ready)return '';
  const L=spL(),hd=(x='')=>`<div class="sh" style="margin-top:22px"><h3>Lịch sử luyện nói</h3>${x}</div>`;
  if(SPH.err&&!L.length)return hd()+`<div class="card"><p class="mut" style="font-size:12.5px">Trình duyệt này không cho lưu lịch sử bài nói (có thể đang ở chế độ riêng tư).</p></div>`;
  if(!L.length){
    const hs=S.speaks||[];
    return hd()+`<div class="card"><p class="mut" style="font-size:12.5px">Từ giờ, mỗi bài nói được chấm sẽ được lưu ở đây cùng bản ghi âm, điểm các tiêu chí, nhận xét và bản cải thiện để bạn xem lại. Dữ liệu chỉ nằm trên máy bạn.</p>${hs.length?`<hr>`+hs.slice(0,5).map(y=>`<div class="li"><div>${new Date(y.t).toLocaleDateString('vi-VN')} · Phần ${y.part}</div><b>${bnd(y.overall)}</b></div>`).join(''):''}</div>`;
  }
  const g={};L.forEach(r=>{(g[r.qkey]||(g[r.qkey]=[])).push(r)});
  const gs=Object.entries(g).sort((a,b)=>b[1][0].t-a[1][0].t),show=sp.hmore?gs:gs.slice(0,8);
  let h=hd(`<button class="lnk" style="color:var(--bad)" onclick="spHClear()">Xóa hết</button>`);
  h+=`<p class="msg">${L.length} bài · ${gs.length} câu hỏi. Chạm vào câu hỏi để xem các lần đã nói.</p>`;
  h+=show.map(([k,rs])=>{const open=!!sp.hx[k],best=Math.max(...rs.map(r=>r.res.overall||0));
    return `<div class="card"><button class="hgb" data-k="${esc(k)}" onclick="spGx(this.dataset.k)"><div style="min-width:0"><span class="tg">Part ${rs[0].part}</span><div class="hgq">${esc(spQMain(rs[0].q))}</div><div class="mut" style="font-size:12px">${rs.length} lần · cao nhất band ${bnd(best)} · gần nhất ${spDt(rs[0].t)}</div></div><span class="mut" style="flex:none">${ic(open?'chevup':'down',16)}</span></button>${open?`<div class="hga">${rs.map(spAtt).join('')}</div>`:''}</div>`}).join('');
  if(gs.length>8)h+=`<div class="more" style="margin:0 0 8px"><button class="lnk" onclick="sp.hmore=!sp.hmore;render()">${sp.hmore?'Thu gọn':'Xem thêm '+(gs.length-8)+' câu'}</button></div>`;
  return h;
}

/* ---- Xem lại một bài đã lưu (đầy đủ: điểm, nhận xét, phát âm, bản cải thiện, nghe lại) ---- */
function spOpenH(id){
  const r=SPH.list.find(x=>x.id===id);if(!r)return;
  plStop(true);stopPlay();wmClose();sp.review=true;sp.hrec=r;sp.res=r.res;sp.blob=r.blob||null;sp.buf=null;sp.why={};sp.err='';render();window.scrollTo(0,0);
}
function spBackH(){sp.review=false;spReset();render()}
function spRedo(){
  const r=sp.hrec;if(!r)return;
  const qs=SPQ[r.part]||[],i=qs.findIndex(x=>spKey(x)===r.qkey);
  if(i<0){alert('Câu hỏi này không còn trong danh sách.');return}
  sp.review=false;spReset();sp.part=r.part;sp.qi=i;sp.picker=false;render();window.scrollTo(0,0);
}
function vSpReview(){
  const r=sp.hrec,cu=spCues(r.q);
  return head('Xem lại bài nói','')+`<div class="pg"><button class="lnk" style="margin-bottom:12px" onclick="spBackH()">${ic('back',14)} Quay lại luyện tập</button>
  <div class="card"><span class="tg">Part ${r.part}</span> <span class="mut" style="font-size:12px;margin-left:6px">${spDt(r.t)}${r.dur?' · '+Math.round(r.dur)+'s':''}</span><div style="height:10px"></div>`
  +(cu?`<div class="sq">${esc(cu.main)}</div><div class="sy">You should say:</div><ul class="cue">${cu.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:`<div class="sq q">${esc(r.q)}</div>`)+`</div>`
  +(r.blob?'':`<p class="msg">Bản ghi âm của bài này không còn trên máy nên không nghe lại được, nhưng điểm và nhận xét vẫn còn.</p>`)
  +spResult(sp.res)
  +`<div class="row" style="margin-top:6px"><button class="btn" onclick="spRedo()">Luyện lại câu này</button><button class="btn s" style="width:auto;flex:none" data-id="${esc(r.id)}" onclick="spHDel(this.dataset.id)" aria-label="Xóa bài này">${ic('trash',16)}</button></div></div>`;
}

/* ---- Đăng nhập / đăng ký ---- */
let AU=null;try{AU=JSON.parse(localStorage.getItem('sp_auth')||'null')}catch(e){}
const authSave=()=>{try{AU?localStorage.setItem('sp_auth',JSON.stringify(AU)):localStorage.removeItem('sp_auth')}catch(e){}};
const isAdmin=()=>!!(AU&&AU.user&&AU.user.role==='admin');
function spLogout(){AU=null;authSave();wrReset();sp.review=false;sp.hrec=null;sp.picker=false;sp.qh=false;sp.res=null;sp.err='';sp.blob=sp.buf=null;stopPlay();wmClose();adm.edit=null;adm.msg=''}
// Gọi máy chủ: tự gắn token, ném Error có thông báo tiếng Việt
async function api(path,opt={}){
  const h={...(opt.headers||{})};
  if(AU)h.Authorization='Bearer '+AU.token;
  if(opt.json!==undefined){h['Content-Type']='application/json';opt={...opt,body:JSON.stringify(opt.json)}}
  let r;
  try{r=await fetch(spCfg().url.replace(/\/+$/,'')+path,{method:opt.method||'GET',body:opt.body,signal:opt.signal,headers:h})}
  catch(e){if(e.name==='AbortError')throw e;const er=new Error('Không kết nối được máy chủ. '+(DEV_CFG?'Kiểm tra địa chỉ trong phần Cấu hình.':'Hãy kiểm tra kết nối mạng và thử lại.')+'');er.net=true;throw er}
  if(r.status===401&&AU&&!path.startsWith('/auth/')){
    spLogout();au.err='Phiên đăng nhập đã hết hạn, hãy đăng nhập lại.';
    const er=new Error(au.err);er.auth=true;throw er;
  }
  if(!r.ok){let d='';try{d=(await r.json()).detail}catch(e){}throw new Error(typeof d==='string'&&d?d:'Lỗi '+r.status)}
  return r.json();
}
function vAuth(){
  const reg=au.mode==='reg';
  return `<div class="card"><b class="t" style="font-size:16px">${reg?'Tạo tài khoản':'Đăng nhập'}</b>
  <p class="mut" style="font-size:12.5px;margin-bottom:16px">Cần đăng nhập để luyện Speaking và chấm Writing. Tra từ, sổ tay, flashcard và bài tập vẫn dùng được mà không cần tài khoản.</p>
  <label class="fl" for="au_u">Tên đăng nhập</label><input class="f" id="au_u" value="${esc(au.user)}" autocapitalize="off" autocomplete="username" oninput="au.user=this.value">
  <label class="fl" for="au_p">Mật khẩu${reg?' (từ 8 ký tự)':''}</label><input class="f" id="au_p" type="password" autocomplete="${reg?'new-password':'current-password'}" onkeydown="if(event.key==='Enter')authGo()">
  ${au.err?`<p class="err">${esc(au.err)}</p>`:''}
  ${reg?'<p class="mut" style="font-size:12px;margin:0 0 12px">Khi đăng ký, bạn đồng ý với <a href="privacy.html" target="_blank" rel="noopener">Điều khoản & Chính sách riêng tư</a>.</p>':''}
  <button class="btn" ${au.busy?'disabled':''} onclick="authGo()">${au.busy?'Đang xử lý…':(reg?'Đăng ký':'Đăng nhập')}</button>
  <div class="more"><button class="lnk" ${au.busy?'disabled':''} onclick="au.mode='${reg?'login':'reg'}';au.err='';render()">${reg?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký'}</button> <a class="lnk" href="privacy.html" target="_blank" rel="noopener">Chính sách riêng tư</a></div></div>`;
}
async function authGo(){
  const u=($('#au_u').value||'').trim(),p=$('#au_p').value;au.user=u;
  if(!u||!p){au.err='Hãy nhập tên đăng nhập và mật khẩu.';render();return}
  au.busy=true;au.err='';render();
  try{
    const d=await api('/auth/'+(au.mode==='reg'?'register':'login'),{method:'POST',json:{username:u,password:p}});
    AU={token:d.token,user:d.user};authSave();au.user='';sp.err='';
    au.busy=false;render();spLoadQs();return;
  }catch(e){au.err=e.message;if(e.net)sp.cfg=true}
  au.busy=false;render();
}
async function spLoadQs(){
  if(!AU)return;
  try{const d=await api('/questions');const cq=curQ(),ck=cq?spKey(cq):null;SPQ=toQ(d);if(ck){const i=(SPQ[sp.part]||[]).findIndex(x=>spKey(x)===ck);if(i>=0)sp.qi=i}try{localStorage.setItem('sp_qs',JSON.stringify(d))}catch(e){}}
  catch(e){if(!e.auth)return}   // lỗi mạng: giữ danh sách đã lưu
  const t=document.activeElement&&document.activeElement.tagName;
  if(tab==='sp'&&!sp.rec&&!sp.busy&&(t!=='INPUT'&&t!=='TEXTAREA'&&t!=='SELECT'))render();
}

/* ---- Admin: quản lý câu hỏi ---- */
function vAdmin(){
  let h=`<div class="card"><div class="row" style="justify-content:space-between"><b class="t" style="margin:0">Quản lý câu hỏi (admin)</b><button class="lnk" onclick="adm.open=!adm.open;adm.msg='';render()">${adm.open?'Ẩn':'Mở'}</button></div>`;
  if(!adm.open)return h+`</div>`;

// Tách ô nhập nhiều câu. Thứ tự ưu tiên:
//  1) có dòng '---'      -> tách theo đó
//  2) có dòng trống      -> mỗi khối cách nhau bởi dòng trống là một câu (câu có thể nhiều dòng)
//  3) còn lại            -> mỗi dòng một câu, trừ dòng bắt đầu bằng chữ thường (câu trước chưa kết thúc) thì nối vào câu trước
// Part 2 giữ xuống dòng trong câu; Part 1/3 nối các dòng thành một câu.
function parseBulk(t,part){
  const n=String(t||'').replace(/\r/g,'').replace(/\u00a0/g,' ');
  const join=part===2?'\n':' ';
  let blocks;
  if(/^[ \t]*-{3,}[ \t]*$/m.test(n))blocks=n.split(/^[ \t]*-{3,}[ \t]*$/m);
  else if(/\n[ \t]*\n/.test(n))blocks=n.split(/\n[ \t]*\n/);
  else{
    blocks=[];
    n.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
      const k=blocks.length-1;
      if(k>=0&&/^[a-z]/.test(l)&&!/[?.!:…"”)]$/.test(blocks[k]))blocks[k]+='\n'+l;
      else blocks.push(l);
    });
  }
  const seen=new Set();
  return blocks
    .map(b=>b.split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>i?l:l.replace(/^(?:\d+[.)]|[-•*])\s+/,'')).join(join))
    .filter(x=>{const k=x.replace(/\s+/g,' ').toLowerCase();if(x.length<5||seen.has(k))return false;seen.add(k);return true});
}
function bulkCount(){const n=parseBulk(adm.bdraft,adm.part).length,b=$('#adm_bb');if(!b)return;
  b.disabled=!n;b.textContent=n?`Thêm ${n} câu vào Part ${adm.part}`:'Chưa có câu hỏi để thêm'}
async function qBulk(){
  const items=parseBulk(adm.bdraft,adm.part);
  if(!items.length){adm.msg='Chưa có câu hỏi hợp lệ để thêm.';render();return}

  try{

    adm.msg=`Đã thêm ${d.added} câu`+(d.duplicate?`, bỏ qua ${d.duplicate} câu trùng`:'')+(d.invalid?`, ${d.invalid} câu không hợp lệ`:'')+'.';
    if(d.added){adm.bdraft='';await spLoadQs()}
  }catch(e){adm.msg=e.message}
  render();
}

/* ---- Phát lại bản ghi (giải mã bằng WebAudio để phát đúng từng từ; bản ghi chỉ nằm trên máy bạn) ---- */
let ac=null,psrc=null;
async function spBuf(){
  if(sp.buf)return sp.buf;if(!sp.blob)return null;
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  sp.buf=await ac.decodeAudioData(await sp.blob.arrayBuffer());return sp.buf;
}
function stopPlay(){try{psrc&&psrc.stop()}catch(e){}psrc=null}
/* ---- Trình phát bản ghi: phát / tạm dừng / tiếp tục / tua ---- */
const pl={st:'idle',off:0,t0:0,dur:0,tk:0,raf:0,drag:false};   // st: idle | play | pause
const plPos=()=>pl.st==='play'&&ac?Math.min(pl.dur||1e9,pl.off+(ac.currentTime-pl.t0)):pl.off;
const plDur=()=>pl.dur||(sp.res&&sp.res.duration)||0;
function plHtml(){
  const d=plDur(),pn=pl.st==='play';
  return `<div class="plw"><button class="plb" id="plbtn" onclick="plToggle()" aria-label="${pn?'Tạm dừng':'Phát bản ghi'}">${ic(pn?'pause':'play',16)}</button><input type="range" id="plr" min="0" max="${d}" step="0.05" value="${plPos()}" oninput="plDrag(this.value)" onchange="plSeek(this.value)" aria-label="Tua bản ghi"><span class="plt" id="plt">${spFmt(plPos()*1000)} / ${spFmt(d*1000)}</span></div>`;
}
function plPaint(){
  const b=$('#plbtn'),r=$('#plr'),l=$('#plt');if(!b)return;
  const pn=pl.st==='play',d=plDur(),pos=plPos();
  b.innerHTML=ic(pn?'pause':'play',16);b.setAttribute('aria-label',pn?'Tạm dừng':'Phát bản ghi');
  if(r){r.max=d;if(!pl.drag)r.value=pos}
  if(l&&!pl.drag)l.textContent=spFmt(pos*1000)+' / '+spFmt(d*1000);
}
function plTick(){cancelAnimationFrame(pl.raf);const f=()=>{if(pl.st!=='play')return;plPaint();pl.raf=requestAnimationFrame(f)};pl.raf=requestAnimationFrame(f)}
function plStop(reset){pl.tk++;stopPlay();cancelAnimationFrame(pl.raf);pl.st='idle';pl.drag=false;if(reset){pl.off=0;pl.dur=0}}
async function plStart(off){
  try{
    const b=await spBuf();if(!b)return;
    if(ac.state==='suspended')await ac.resume();
    stopPlay();const tk=++pl.tk;pl.dur=b.duration;
    off=Math.max(0,Math.min(+off||0,b.duration-.05));
    const n=ac.createBufferSource();n.buffer=b;n.connect(ac.destination);
    n.onended=()=>{if(pl.tk!==tk)return;pl.st='idle';pl.off=0;cancelAnimationFrame(pl.raf);plPaint()};
    n.start(0,off);psrc=n;pl.off=off;pl.t0=ac.currentTime;pl.st='play';plTick();plPaint();
  }catch(x){sp.err='Không phát được bản ghi trên thiết bị này.';render()}
}
function plPause(){if(pl.st!=='play')return;pl.off=plPos();pl.tk++;stopPlay();cancelAnimationFrame(pl.raf);pl.st='pause';plPaint()}
function plToggle(){if(pl.st==='play')plPause();else plStart(pl.off)}   // idle/pause: phát từ vị trí hiện tại
function plDrag(v){pl.drag=true;const l=$('#plt');if(l)l.textContent=spFmt(v*1000)+' / '+spFmt(plDur()*1000)}
function plSeek(v){pl.drag=false;v=+v;if(pl.st==='play')plStart(v);else{pl.off=v;if(pl.st==='idle'&&v>0)pl.st='pause';plPaint()}}
async function playSeg(s,e){
  if(pl.st==='play')plPause();
  try{
    const b=await spBuf();if(!b)return;if(ac.state==='suspended')await ac.resume();
    stopPlay();const n=ac.createBufferSource();n.buffer=b;n.connect(ac.destination);
    const a=Math.max(0,s-.08);n.start(0,a,Math.max(.2,Math.min(b.duration,e+.12)-a));psrc=n;
  }catch(x){sp.err='Không phát được bản ghi trên thiết bị này.';render()}
}
// Câu trả lời: gạch đỏ (sai) → chữ xanh (nên nói) + nút "giải thích"
function spAnswer(r){
  const t=r.transcript||'',cs=(r.llm&&r.llm.corrections)||[],hit=[],rest=[];
  cs.forEach((c,i)=>{const o=(c.original||'').trim(),k=o?t.toLowerCase().indexOf(o.toLowerCase()):-1;
    if(k<0||hit.some(x=>k<x.e&&k+o.length>x.k))rest.push(c);else hit.push({k,e:k+o.length,c,i})});
  hit.sort((x,y)=>x.k-y.k);
  let d='',p=0;
  hit.forEach(x=>{d+=esc(t.slice(p,x.k))+`<s class="del">${esc(t.slice(x.k,x.e))}</s> <span class="ins">${esc(x.c.better)}</span> <button class="lnk" onclick="sp.why[${x.i}]=!sp.why[${x.i}];render()">giải thích</button>`+(sp.why[x.i]?`<span class="why">${esc(x.c.why_vi)}</span>`:' ');p=x.e});
  d+=esc(t.slice(p));
  return `<div class="card"><b class="t">Câu trả lời của bạn</b>${sp.blob?plHtml():''}<div class="dv">${d}</div>`
    +rest.map(c=>`<div class="li"><div><span class="mut">${esc(c.original)}</span><br><b>${esc(c.better)}</b><br><span class="mut" style="font-size:12px">${esc(c.why_vi)}</span></div></div>`).join('')+`</div>`;
}

/* ---- Cửa sổ luyện phát âm một từ ---- */
const PH_DI=['tʃ','dʒ','eɪ','aɪ','ɔɪ','aʊ','əʊ','oʊ','ɪə','eə','ʊə'];
function phTok(s){   // tách chuỗi IPA thành từng âm (âm đôi, dấu kéo dài ː)
  s=String(s||'').replace(/[\/\[\]ˈˌ.]/g,'').trim();
  if(/\s/.test(s))return s.split(/\s+/);
  const o=[];let i=0;
  while(i<s.length){
    if(PH_DI.includes(s.substr(i,2))){o.push(s.substr(i,2));i+=2;continue}
    let c=s[i++];while(i<s.length&&/[ːˑ:\u0300-\u036f\u02b0-\u02ff]/.test(s[i]))c+=s[i++];
    o.push(c.replace(':','ː'));
  }
  return o;
}
function phDiff(a,b){   // đánh dấu âm nào khớp nhau (LCS)
  const n=a.length,m=b.length,L=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const A=a.map(p=>({p,ok:false})),B=b.map(p=>({p,ok:false}));let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){A[i].ok=B[j].ok=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  return{A,B};
}
const TRC={};
function wmOpen(i){
  const x=(sp.res.word_marks||[])[i];if(!x)return;stopPlay();
  const w=x.w.replace(/[^A-Za-z' ]/g,'').trim();

  if(!wm.vi){const m=wm;tr(w).then(v=>{if(v)TRC[w.toLowerCase()]=v;if(wm===m){m.vi=v;render()}})}
  render();
}

  ${r?`<p class="${r.ok?'msg':'err'}" style="${r.ok?'color:var(--ok);font-weight:700;':''}margin:0 0 12px">${r.ok?'Phát âm tốt! ':'Chưa chuẩn, hãy nghe mẫu rồi thử lại. '}(${r.score}/100)</p>`:''}

  <p class="mut" style="font-size:11.5px;margin:10px 0 0">${x.rec?'Đang ghi âm, hãy đọc to từ này…':'Nhấn “Ghi âm ngay” rồi đọc từ trên.'}</p></div></div>`;
}
async function wmToggle(){
  const m=wm;if(!m||m.busy)return;
  if(m.rec){m.mr.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];
    const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
    m.mr=new MediaRecorder(st,mt?{mimeType:mt}:{});
    m.mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
    m.mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearTimeout(m.to);m.rec=false;if(m.cancel)return;wmSend(m,new Blob(ch,{type:m.mr.mimeType||mt||'audio/webm'}))};
    m.mr.start();m.rec=true;m.err='';m.res=null;stopPlay();
    m.to=setTimeout(()=>{if(m.mr.state==='recording')m.mr.stop()},6000);render();
  }catch(e){m.err='Không mở được micro. Hãy cho phép quyền micro.';render()}
}
async function wmSend(m,blob){
  m.busy=true;m.err='';render();
  const fd=new FormData();fd.append('file',blob,'w.'+(blob.type.includes('mp4')?'m4a':'webm'));fd.append('word',m.w);
  try{
    const job=await api('/assess/word',{method:'POST',body:fd});
    for(let i=0,nf=0;i<80&&!m.res;i++){
      await new Promise(r=>setTimeout(r,1500));if(wm!==m)return;
      let q;try{q=await api('/assess/'+job.job_id);nf=0}catch(e){if(e.net&&++nf<6)continue;throw e}
      if(q.status==='done')m.res=q.result;
      else if(q.status==='error')throw new Error(q.error||'Chấm thất bại');
    }
    if(!m.res)throw new Error('quá thời gian chờ');
  }catch(e){if(!e.auth)m.err='Không chấm được: '+e.message}
  m.busy=false;if(wm===m)render();
}
async function spToggle(){
  if(sp.rec){sp.mr.stop();return}
  const c=spCfg();
  if(!c.url){sp.cfg=DEV_CFG;sp.err='Hãy nhập địa chỉ máy chủ chấm điểm trước.';render();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
    sp.chunks=[];sp.mr=new MediaRecorder(st,mt?{mimeType:mt}:{});
    sp.mr.ondataavailable=e=>{if(e.data.size)sp.chunks.push(e.data)};
    sp.mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(sp.timer);sp.rec=false;sp.paused=false;sp.hrec=null;plStop(true);sp.blob=new Blob(sp.chunks,{type:sp.mr.mimeType||mt||'audio/webm'});sp.buf=null;sp.why={};wmClose();spSend(sp.blob)};
    sp.mr.start();sp.rec=true;sp.paused=false;sp.acc=0;sp.seg=Date.now();sp.err='';sp.res=null;sp.hrec=null;sp.t0=Date.now();render();
    sp.timer=setInterval(()=>{const ms=spEl(),e=$('#sptime');if(e)e.textContent=spFmt(ms);if(ms>=170000&&sp.mr.state!=='inactive')sp.mr.stop()},500);
  }catch(e){sp.err='Không mở được micro. Hãy cho phép quyền micro (trang phải chạy bằng HTTPS).';render()}
}
let spCtl=null;   // AbortController của lượt chấm đang chạy (cho nút "Dừng chấm")
function spStop(){const c=spCtl;if(!c||c.userStop)return;c.userStop=true;c.abort()}
async function spSend(blob){
  const q=curQ();sp.busy=true;sp.err='';sp.ahead=null;render();
  const fd=new FormData();
  fd.append('file',blob,'answer.'+(blob.type.includes('mp4')?'m4a':'webm'));
  fd.append('part',sp.part);fd.append('question',q?q.text:'');
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15*60*1000);spCtl=ctl;
  try{
    // 1) gửi bài, máy chủ xếp vào hàng đợi và trả job_id ngay
    const job=await api('/assess',{method:'POST',body:fd,signal:ctl.signal});
    sp.ahead=job.ahead;render();
    // 2) hỏi kết quả mỗi 2 giây (chịu được vài lần rớt mạng ngắn)
    let netFails=0;
    for(;;){
      await new Promise(r=>{const t=setTimeout(r,1000);ctl.signal.addEventListener('abort',()=>{clearTimeout(t);r()},{once:true})});
      let s2;
      try{s2=await api('/assess/'+job.job_id,{signal:ctl.signal});netFails=0}
      catch(e){if(e.net&&++netFails<8)continue;throw e}
      if(s2.status==='done'){sp.res=s2.result;sp.res.jobId=job.job_id;break}
      if(s2.status==='error')throw new Error(s2.error||'Chấm điểm thất bại');
      if(s2.ahead!==sp.ahead){sp.ahead=s2.ahead;render()}
    }
    S.speaks=[{t:Date.now(),part:sp.part,overall:sp.res.overall},...(S.speaks||[])].slice(0,30);save();
    spHAdd(q,blob);
  }catch(e){
    if(e.net&&DEV_CFG)sp.cfg=true;
    if(ctl.userStop)sp.err='';                                   // tự bấm Dừng: không phải lỗi
    else if(!e.auth)sp.err='Không chấm được: '+(e.name==='AbortError'?'quá thời gian chờ':e.message);
    if(e.name==='AbortError'||e.net)api('/assess/cancel',{method:'POST'}).catch(()=>{});  // đừng để job mồ côi chặn lần sau
    if(ctl.userStop)setTimeout(()=>{if(!sp.busy)api('/assess/cancel',{method:'POST'}).catch(()=>{})},2500);  // phòng khi bài vừa kịp vào hàng đợi
  }
  clearTimeout(to);if(spCtl===ctl)spCtl=null;sp.busy=false;sp.ahead=null;render();
}
async function spImprove(){

  catch(e){if(!e.auth)r.impErr=e.message}
  r.impBusy=false;render();
}

    <p style="margin-top:10px;white-space:pre-wrap">${esc(m.improved_answer)}</p>`

    +((m.useful_phrases||[]).length?`<hr><b class="t">Cụm từ nên học</b>`+m.useful_phrases.map(p=>`<div class="li"><div><b>${esc(p.phrase)}</b><br><span class="mut" style="font-size:12px">${esc(p.meaning_vi)}</span></div>${spk(p.phrase)}</div>`).join(''):'')
    +`<button class="btn s sm" style="margin-top:14px" onclick="spImprove2()">Viết lại bản khác</button></div>`;
